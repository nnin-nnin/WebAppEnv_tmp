application:
  name: BookStack
  version: "24.05"
  type: full_web_application
  description: "BookStack is a simple, self-hosted, easy-to-use platform for organising and storing information."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署。应用服务（BookStack / PHP 8.5 Nginx）与数据库服务（MariaDB 10.5）分别运行在独立的容器中，并通过 Compose 专有网络通信。"
  compose_file: docker/compose.yaml
  project_name: bookstack-24-05
  host_port: 18650
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/BookStackApp/BookStack
    commit: 77fc37ac257f66f90d5c0fa9799d2fab5b0d6342
    tag: v24.05
    source_yaml: source/source.yaml

services:
  app:
    service_name: app
    role: "Web Application & PHP Runtime"
    image: yorem/bookstack:24.05@sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc
    digest: "sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc"
    platform: linux/amd64
    ports:
      - "18650:80"
    dependencies:
      - db
    healthcheck: "curl -f -s -o /dev/null http://127.0.0.1:80/login || exit 1"
  db:
    service_name: db
    role: "Relational Database (MariaDB 10.5)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"
    volumes:
      - db-data

credentials:
  admin_username: admin@admin.com
  admin_password: password
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
