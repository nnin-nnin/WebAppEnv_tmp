name: bookstack-24-05

services:
  app:
    image: yorem/bookstack:24.05@sha256:189c796273469115cf810e53f450e15b93184018e4728cd65fcaef8aa93584bc
    platform: linux/amd64
    ports:
      - "18650:80"
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=http://127.0.0.1:18650
      - APP_KEY=base64:6Ihc3/q18EnKgwmV8e7ZRzyvbcxxz89B5i4ON4A3ixM=
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=bookstack
      - DB_USERNAME=bookstack
      - DB_PASS=benchmark-only
      - DB_PASSWORD=benchmark-only
      - DB_DATABASE=bookstackapp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/config
      - ../resources/initial-data/.env:/app/www/.env.example:ro
      - ../resources/initial-data/opcache.ini:/etc/php85/conf.d/99_opcache.ini:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark-only-root
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=benchmark-only
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-data:
  db-data:
