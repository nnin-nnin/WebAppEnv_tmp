server:
  port: 80
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mall
    password: mall
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  redis:
    host: 127.0.0.1
    database: 0
    port: 6379
    timeout: 300ms
  web:
    resources:
      static-locations: file:/opt/mall/web/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

secure:
  ignored:
    urls:
      - /
      - /index.html
      - /swagger-ui/**
      - /swagger-resources/**
      - /**/v2/api-docs
      - /**/*.html
      - /**/*.js
      - /**/*.css
      - /**/*.png
      - /**/*.map
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      - /minio/upload

minio:
  endpoint: http://127.0.0.1:9000
  bucketName: mall
  accessKey: disabled
  secretKey: disabled

logging:
  file:
    path: /var/log/mall
  level:
    root: info
    com.macro.mall: info
