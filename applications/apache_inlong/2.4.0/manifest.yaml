notes:
- The environment is a native multi-container Docker Compose deployment.
- The dashboard, manager, dataproxy, agent, audit, mysql, pulsar, jobmanager, and
  taskmanager services run in separate containers.
- The original compose used 'tubemq-server:2181' for ZK_URL but InLong uses pulsar
  in this compose setup.
