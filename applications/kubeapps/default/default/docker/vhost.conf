server {
    listen 8080;
    server_name _;
    root /app;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        absolute_redirect off;
        rewrite ^([^.]*[^/])$ $1/ permanent;
        rewrite ^/[^/]+/([^/]+)$ /$1 break;
        rewrite ^/[^/]+/static/(.*) /static/$1 break;
        try_files $uri $uri/ /index.html;
    }
}
