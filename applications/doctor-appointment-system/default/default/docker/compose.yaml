name: doctor-appointment-system-default

services:
  app:
    image: yorem/doctor-appointment-system:default@sha256:a5d3832a5d8294263aaeb6339d864d0a1afdc3865979021dbb2bed20c014dc6a
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: benchmark-only
      DB_NAME: hospital
    ports:
      - "18817:80"
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci", "--lower_case_table_names=1"]
    environment:
      MARIADB_ROOT_PASSWORD: benchmark-only
      MARIADB_DATABASE: hospital
      MYSQL_ROOT_PASSWORD: benchmark-only
      MYSQL_DATABASE: hospital
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pbenchmark-only || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  database-data:
