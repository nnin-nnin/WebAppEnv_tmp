roles:
  - name: admin
    permissions:
      - full_access
      - manage_doctors
      - manage_patients
      - manage_reports
      - view_appointments
      - view_history
    purpose: Administrator role with complete access to manage hospital staff, patients, and records
  - name: doctor
    permissions:
      - view_appointments
      - cancel_appointments
      - upload_history
      - view_history
      - manage_profile
    purpose: Medical doctor role to review appointments and update patient medical history
  - name: patient
    permissions:
      - book_appointments
      - cancel_appointments
      - upload_reports
      - view_reports
      - manage_profile
    purpose: Patient role to search doctors, book appointments, and upload medical reports
