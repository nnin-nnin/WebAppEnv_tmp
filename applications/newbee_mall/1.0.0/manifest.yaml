name: newbee-mall
version: 1.0.0
type: full_web
deployment_mode: native_compose
compose_file: docker/compose.yaml
compose_project_name: newbee-mall-1.0.0
official_compose_source: None provided officially, custom built conforming to official
  architecture
backend_repository: https://github.com/newbee-ltd/newbee-mall
backend_commit: a069069b07027613bf0e7f571736be86f431faee
frontend_repository: 
frontend_commit: 
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
images_archive_manifest: image/image.json
images_archive_checksum: image/SHA256SUMS
services:
- name: application
  role: app
  image: yorem/newbee-mall:1.0.0@sha256:ad016fb1454bb256b6508f6f1b74ff773014e75fbcc9e6a3c0a644abf0f21dff
  tag: 1.0.0
  platform: linux/amd64
  source: built from source
  ports:
  - 28089:28089
  depends_on:
  - db
  healthcheck: curl http://localhost:28089/
  volumes: []
  digest: sha256:ad016fb1454bb256b6508f6f1b74ff773014e75fbcc9e6a3c0a644abf0f21dff
- name: db
  role: database
  image: mysql
  tag: 8.0.35
  platform: linux/amd64
  source: docker hub
  ports: []
  depends_on: []
  healthcheck: mysqladmin ping
  volumes:
  - database-data:/var/lib/mysql
  digest: sha256:9095b039775474d4a652430c1bab0db55d48d7d1885278566152927e4844e84b
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  build: scripts/build.sh
  load_images: scripts/load-images.sh
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  register: resources/register.sh
differences_from_official:
- Official repo doesn't provide docker compose.
- Created Dockerfile to package the Spring Boot jar.
- Added mysql:8.0.35 service.
- Injected database seed script directly via docker-entrypoint-initdb.d.
known_risks:
- The application uses image CAPTCHA for login and register. Automated scripts cannot
  bypass it and may return partial success.
