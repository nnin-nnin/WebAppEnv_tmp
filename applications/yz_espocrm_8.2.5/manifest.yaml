application: EspoCRM
version: 8.2.5
application_type: full_web_application
source_repository: https://github.com/espocrm/espocrm
source_commit: 268009e5f6def27488a1949937f359eadd73fd15
source_commit_tag: 8.2.5
source_tag_object: 06be47c3488c7c369ee879b920ec4c3fc4acbb5d
frontend_repository: null
frontend_commit: null
source_checksum_file: source/SHA256SUMS
target_platform: linux/amd64
runtime:
  base_image: php:8.3-apache@sha256:973e11c67c1c81e7811077a0efa0f910cf903af0ba972cab6ba0c0e15913c771
  php: 8.3.33
  web_server: Apache 2.4.68 with mod_rewrite
  database: MariaDB 11.8.6 (in the same container)
  runtime_version_note: "2026-08-05 重建时基础镜像 php:8.3-apache 已随 Debian 升级，容器内 MariaDB 由 10.11 变为 11.8.6（PHP 仍为 8.3.33）。重建后的镜像已通过完整动态验收。基础镜像自本次起固定 digest，避免继续漂移。"
frontend:
  build_command: composer install --no-dev && npm ci --no-audit --no-fund && npx grunt offline
  static_assets: client/lib and generated bundled frontend assets
  browser_entry: http://localhost:18292/
  api_base: same-origin /api/v1
port: 18292
image: asteriskax001/sop-espocrm:8.2.5
all_in_one: true
components:
  - EspoCRM PHP backend and bundled SPA frontend
  - Apache web server
  - PHP 8.3 runtime and extensions
  - MariaDB 11.8.6 database service on 127.0.0.1
  - automatic idempotent database/schema and admin initialization
image_archive: image/espocrm-8.2.5-linux-amd64.tar
image_metadata: image/image.json
image_checksums: image/SHA256SUMS
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  register: resources/register.sh
scripts:
  build: scripts/build.sh
  start: scripts/entrypoint.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
recommended_run: docker run -d -p 18292:80 asteriskax001/sop-espocrm:8.2.5
notes: 单镜像、单容器 all-in-one 环境；应用和数据库均在容器内，数据库连接为 127.0.0.1，数据可通过 /var/www/html/data 和 /var/lib/mysql 卷持久化。
