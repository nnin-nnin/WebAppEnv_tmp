application: phpmyadmin
version: "5.2.1"
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/phpmyadmin/phpmyadmin
  commit: 11e127f3fa64adb099d765c4cae6de026954068c
runtime:
  language: php
  web_server: apache
ports:
  host_port: 18691
  container_port: 80
credentials:
  admin_username: admin
  admin_password: Admin123456!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/phpmyadmin:5.2.1
    tag: "5.2.1"
    digest: sha256:9e915766488a0f603183367a4b51f5db6309ea801f3eaa25138a83815772b14f
    platform: linux/amd64
