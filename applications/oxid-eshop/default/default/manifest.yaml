application: oxid-eshop
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/OXID-eSales/oxideshop_ce
  commit: fb4428902f8a30b8a72903d3b5d0f2c23dfeafbc
runtime:
  php: "8.4"
  web_server: apache
  database: mariadb:10.5
ports:
  host_port: 18851
  container_port: 80
credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  web:
    image: yorem/oxid-eshop:default@sha256:86a69a55d264ac52476b4fa155b969e63dffb136893199a6cc7739d4c02a9056
    tag: default
    digest: sha256:86a69a55d264ac52476b4fa155b969e63dffb136893199a6cc7739d4c02a9056
    platform: linux/amd64
  db:
    image: mariadb:10.5
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
