name: hedgedoc_1_9_9_default

services:
  app:
    image: yorem/hedgedoc:1.9.9@sha256:53a21ddeb2ed0f9b9be67cf143d9429f9f7480d997d5e5533ab11bee32a4e876
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18670:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - CMD_DB_URL=sqlite:///data/hedgedoc.sqlite
    volumes:
      - hedgedoc_data:/data

volumes:
  hedgedoc_data:
