application: hedgedoc
version: 1.9.9
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/hedgedoc/hedgedoc
  commit: f52475dc4f3e3e27927a073754ff86fe6ff1e01a
runtime:
  language: nodejs
  server: nodejs
ports:
  host_port: 18670
  container_port: 3000
credentials:
  admin_username: admin@example.com
  admin_password: Admin123456!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/hedgedoc:1.9.9@sha256:53a21ddeb2ed0f9b9be67cf143d9429f9f7480d997d5e5533ab11bee32a4e876
