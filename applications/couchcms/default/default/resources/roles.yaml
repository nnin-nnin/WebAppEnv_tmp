roles:
  - name: superadmin
    role_id: 1
    access_level: 10
    description: Full system super administrator with access to all settings, templates, editable regions, and user management.
    associated_accounts:
      - admin

  - name: admin
    role_id: 2
    access_level: 7
    description: System administrator with access to manage content, pages, comments, and folders.
    associated_accounts: []

  - name: authenticated_user_special
    role_id: 3
    access_level: 4
    description: Authenticated user with elevated privileges for specialized content access.
    associated_accounts: []

  - name: authenticated_user
    role_id: 4
    access_level: 2
    description: Regular authenticated member account capable of accessing protected pages.
    associated_accounts: []

  - name: unauthenticated_user
    role_id: 5
    access_level: 0
    description: Anonymous public visitor with read access to public pages.
    associated_accounts: []
