name: couchcms_default

services:
  app:
    image: yorem/couchcms:default@sha256:3079142eaa73c169c667347c3bb684c4b96a646329dbfd83be79ae9814466b95
    platform: linux/amd64
    ports:
      - "18810:80"
    environment:
      COUCH_DB_HOST: db
      COUCH_DB_NAME: couchcms
      COUCH_DB_USER: couchcms
      COUCH_DB_PASSWORD: couchcms_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application-data:/var/www/html/couch/uploads
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: couchcms_root_pass
      MYSQL_DATABASE: couchcms
      MYSQL_USER: couchcms
      MYSQL_PASSWORD: couchcms_pass
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -pcouchcms_root_pass || mysqladmin ping -h localhost -u root -pcouchcms_root_pass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  application-data:
  database-data:
