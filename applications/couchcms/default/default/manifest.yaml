id: couchcms_default
application: CouchCMS
version: default
artifact_type: ready_application_environment
status: native_compose_ready
application_type: complete_web_application
deployment_mode: native_compose
deployment_statement: "This is a native multi-container Docker Compose deployment, not an all-in-one single-container deployment. Application and database run in independent containers and communicate through the Compose network."

documentation:
  readme: README.md
  compose_file: docker/compose.yaml
  recommended_start: "docker compose -f docker/compose.yaml up -d"

compose:
  project_name: couchcms_default
  standard_entrypoint: docker/compose.yaml
  service_names:
    - app
    - db
  network: "Compose-created default network; containers communicate via service names (db)"
  volumes:
    - application-data
    - database-data
  external_dependencies: false

official_compose:
  development: null
  status: "Official repository does not provide Docker Compose configuration. Defined standard native Compose topology with separate app and db services."

source:
  backend:
    repository: https://github.com/CouchCMS/CouchCMS
    ref: HEAD
    commit: 60484485752b04346a49a1ed370f784eb45d5ede
  frontend:
    repository: null
    commit: null
    note: "Frontend templates and assets are bundled within the main repository."
  metadata: source/source.yaml

runtime:
  platform: linux/amd64
  php: 8.2
  web_server: Apache 2.4
  database: MariaDB 10.5
  public_url: http://localhost:18810/
  container_web_port: 80
  container_db_port: 3306
  database_seed: resources/initial-data/database-seed.sql

services:
  - name: app
    role: "CouchCMS PHP 8.2 Apache Web Application"
    image: yorem/couchcms:default@sha256:3079142eaa73c169c667347c3bb684c4b96a646329dbfd83be79ae9814466b95
    tag: default
    digest: sha256:3079142eaa73c169c667347c3bb684c4b96a646329dbfd83be79ae9814466b95
    platform: linux/amd64
    source: "Built from fixed source commit 60484485752b04346a49a1ed370f784eb45d5ede and docker/Dockerfile"
    ports:
      - 18810:80
    depends_on:
      - db: service_healthy
    healthcheck: "HTTP GET / returns 200/302"
    volumes:
      - application-data:/var/www/html/couch/uploads

  - name: db
    role: "MariaDB Relational Database"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: 10.5
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB 10.5 image"
    ports: []
    depends_on: []
    healthcheck: "mariadb-admin ping or mysqladmin ping"
    volumes:
      - database-data:/var/lib/mysql

delivery:
  mode: DOCKERHUB
  registry: docker.io
  namespace: yorem
  registry_images:
    app: yorem/couchcms:default
    db: mariadb:10.5
  start_command: "docker compose -f docker/compose.yaml up -d"
  health_command: "bash scripts/healthcheck.sh"
  reset_command: "bash scripts/reset.sh"

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/initial-data/database-seed.sql

scripts:
  build: scripts/build.sh
  start: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

initial_account:
  username: admin
  password: AdminPassword123!
  role: superadmin
  creation: "Initialized via resources/initial-data/database-seed.sql into couch_users with phpass hash and access_level=10"

official_vs_delivery:
  - "Official repo does not contain Dockerfile or Docker Compose configs; delivery defines a standard multi-container topology (app + db)."
  - "Application and database run in separate containers connected via Compose default network."
  - "Pre-populated database seed ensures zero-install startup with pre-configured admin user admin / AdminPassword123!."
  - "All image tags are pinned and built for linux/amd64."

known_limitations:
  - "Benchmark credentials (admin / AdminPassword123!) are stored in database seed and configuration files."
  - "ARM64 host systems rely on Docker linux/amd64 emulation mode."
