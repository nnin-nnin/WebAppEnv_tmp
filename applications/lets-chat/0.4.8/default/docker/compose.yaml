name: lets_chat_0_4_8_default

services:
  mongo:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - mongo-data:/data/db

  app:
    image: yorem/lets-chat:0.4.8@sha256:5b923d428176250653530fdac8a9f925043f30c511b77701662d7f8fab74961c
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18631:5000"
    environment:
      - LCB_DATABASE_URI=mongodb://mongo:27017/letschat
      - LCB_HTTP_PORT=5000
      - LCB_HTTP_HOST=0.0.0.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - letschat-uploads:/usr/src/app/uploads

volumes:
  mongo-data:
  letschat-uploads:
