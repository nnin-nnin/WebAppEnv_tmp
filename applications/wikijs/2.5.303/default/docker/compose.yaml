name: wikijs_2_5_303_default

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: benchmark-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    image: yorem/wikijs:2.5.303@sha256:b6bd32a3da63eb5dac54af443880ed466abd91448d66b8f806f8c3c66f7a3601
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: benchmark-only
      DB_NAME: wiki
    ports:
      - "18659:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
