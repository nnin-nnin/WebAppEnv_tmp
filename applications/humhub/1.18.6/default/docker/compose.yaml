name: humhub-1-18-6

services:
  app:
    image: yorem/humhub:1.18.6@sha256:9978bff0d2b9f7efe2dce3d8344d6b31e3c1da561367e971d6803551a0a1c589
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18564}:80"
    environment:
      SERVER_NAME: ":80"
      HUMHUB_DOCKER__MERCURE_ENABLE: "false"
      HUMHUB_DB_HOST: db
      HUMHUB_DB_NAME: humhub
      HUMHUB_DB_USER: humhub
      HUMHUB_DB_PASSWORD: humhub_pass
      HUMHUB_CONFIG__COMPONENTS__DB__DSN: "mysql:host=db;dbname=humhub"
      HUMHUB_CONFIG__COMPONENTS__DB__USERNAME: "humhub"
      HUMHUB_CONFIG__COMPONENTS__DB__PASSWORD: "humhub_pass"
      HUMHUB_CONFIG__COMPONENTS__URL_MANAGER__SHOW_SCRIPT_NAME: "false"
      HUMHUB_CONFIG__COMPONENTS__URL_MANAGER__ENABLE_PRETTY_URL: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:80/user/auth/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  db:
    image: mariadb:10.11.8@sha256:3f111eec639eeb22518b22566e9241f08bf13dcd5269472d79083b9dc39d7a9f
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: humhub_pass
      MYSQL_DATABASE: humhub
      MYSQL_USER: humhub
      MYSQL_PASSWORD: humhub_pass
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/database-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-data:
  db-data:
