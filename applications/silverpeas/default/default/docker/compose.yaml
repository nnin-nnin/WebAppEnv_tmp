name: silverpeas-default-default

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: Silverpeas
      POSTGRES_USER: silverpeas
      POSTGRES_PASSWORD: SilverpeasPassword123!
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silverpeas -d Silverpeas"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  application:
    image: yorem/silverpeas:default@sha256:157b1306ddfbec8e525419955c1e10f067f57924481b60c119061be52b873831
    platform: linux/amd64
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/silverpeas/data/jcr
        cp -n /opt/silverpeas/configuration/silverpeas/resources/silverpeas-oak.properties /opt/silverpeas/data/jcr/
        find /opt/silverpeas/properties/ -type f -exec sed -i "s|@DataSourceJNDIName@|java:/datasources/silverpeas|g" {} +
        sed -i "s|@SecurityDir@|/opt/silverpeas/data|g" /opt/silverpeas/properties/org/silverpeas/general.properties
        exec /opt/run.sh
    ports:
      - "18864:8000"
    environment:
      DB_SERVER: db
      DB_NAME: Silverpeas
      DB_USER: silverpeas
      DB_PASSWORD: SilverpeasPassword123!
      SILVERPEAS_ADMIN_LOGIN: silverpeas
      SILVERPEAS_ADMIN_PASSWORD: SilverpeasPassword123!
      JBOSS_MODULEPATH: "/opt/wildfly/modules:/opt/silverpeas/configuration/jboss/modules"
      JAVA_TOOL_OPTIONS: "-DSILVERPEAS_HOME=/opt/silverpeas -DSILVERPEAS_DATA_HOME=/opt/silverpeas/data -DSILVERPEAS_TEMP=/opt/silverpeas/data/temp -DSILVERPEAS_LOG=/opt/silverpeas/log -Djcr.home=/opt/silverpeas/data/jcr -Djcr.conf=/opt/silverpeas/data/jcr/silverpeas-oak.properties -Djdk.lang.Process.launchMechanism=vfork"
      _JAVA_OPTIONS: "-Djdk.lang.Process.launchMechanism=vfork"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - silverpeas-data:/opt/silverpeas/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sL --max-time 5 http://127.0.0.1:8000/silverpeas/defaultLogin.jsp | grep -q 'formLogin' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  db-data:
  silverpeas-data:
