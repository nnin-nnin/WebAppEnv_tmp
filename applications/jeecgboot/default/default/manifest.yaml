application:
  name: JeecgBoot
  version: default
  type: full_web_application
  description: "JeecgBoot is an enterprise-grade low-code development platform based on Spring Boot 2.x and MyBatis-Plus."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境为原生多容器 Docker Compose 编排。JeecgBoot 后端应用、MySQL 8.0 数据库与 Redis 缓存分别运行在独立容器中，并通过 Compose 网络通信互联。"
  compose_file: docker/compose.yaml
  project_name: jeecgboot-default-default
  host_port: 18833
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/jeecgboot/jeecg-boot
    commit: 7167668c2a6cf5a181e73ff6ad9714842a36cd7c
    tag: v3.5.3
    source_yaml: source/source.yaml

services:
  jeecgboot:
    service_name: jeecgboot
    role: "JeecgBoot Application Service (Spring Boot 2.7 / Java 8)"
    image: yorem/jeecgboot:default@sha256:87c41f054c48c9dced282062b0175fb5bbfcf5020884e376d205591a5c4c4860
    digest: "sha256:87c41f054c48c9dced282062b0175fb5bbfcf5020884e376d205591a5c4c4860"
    platform: linux/amd64
    ports:
      - "18833:8080"
    dependencies:
      - db
      - redis
    healthcheck: "curl -f -s -o /dev/null http://localhost:8080/jeecg-boot/doc.html || exit 1"
  db:
    service_name: db
    role: "Relational Database (MySQL 8.0)"
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    digest: "sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -h localhost -u root -proot || exit 1"
    volumes:
      - database-data
  redis:
    service_name: redis
    role: "In-memory Cache (Redis 7)"
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    digest: "sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "redis-cli ping || exit 1"
    volumes:
      - redis-data

credentials:
  admin_username: admin
  admin_password: "123456"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
