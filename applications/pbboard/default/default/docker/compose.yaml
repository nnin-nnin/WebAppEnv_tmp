name: pbboard_default

services:
  web:
    image: yorem/pbboard:default@sha256:936853cc7448de4da3092eb9e6510cdf8d10e41e513670c2609ec7474c8eccbe
    platform: linux/amd64
    ports:
      - "18852:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_DATABASE: pbboard
      DB_USERNAME: pbboard
      DB_PASSWORD: password
      SITE_URL: http://127.0.0.1:18852
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: pbboard
      MYSQL_USER: pbboard
      MYSQL_PASSWORD: password
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
