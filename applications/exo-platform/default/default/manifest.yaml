application:
  name: eXo Platform
  version: default
  type: full_web_application
  description: "eXo Platform is an open-source digital workplace platform."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署。应用服务（eXo Platform / Tomcat Java 21）与搜索引擎服务（Elasticsearch 8.14.3）分别运行在独立的容器中，并通过 Compose 专有网络通信。"
  compose_file: docker/compose.yaml
  project_name: exo-platform_default
  host_port: 18824
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/exoplatform/exo-community.git
    commit: 512519e82cb7029fa94895007dc52a9dc4b4892e
    tag: HEAD
    source_yaml: source/source.yaml

services:
  elasticsearch:
    service_name: elasticsearch
    role: "Search & Analytics Engine (Elasticsearch 8.14.3)"
    image: elasticsearch:8.14.3@sha256:1ddbb1ae0754278f3ab53edc24fcc5c790ebc2422cc47abea760b24abee2d88a
    digest: "sha256:1ddbb1ae0754278f3ab53edc24fcc5c790ebc2422cc47abea760b24abee2d88a"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "curl -s http://localhost:9200/_cluster/health"
    volumes:
      - es_data
      - es_tmp
  application:
    service_name: application
    role: "Web Application & Java Portal Runtime"
    image: yorem/exo-platform:default@sha256:b7becad322b60255189b7338b732e9d261a3cef2ecd18bf22e67707353df4eef
    digest: "sha256:b7becad322b60255189b7338b732e9d261a3cef2ecd18bf22e67707353df4eef"
    platform: linux/amd64
    ports:
      - "18824:8080"
    dependencies:
      - elasticsearch
    healthcheck: "curl -f -s -o /dev/null http://localhost:8080/portal/ || exit 1"
    volumes:
      - exo_data
      - exo_codec
      - exo_logs

credentials:
  admin_username: admin
  admin_password: "AdminPassword123!"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"
