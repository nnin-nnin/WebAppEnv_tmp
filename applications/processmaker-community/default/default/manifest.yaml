application:
  name: ProcessMaker Community
  version: default
  type: full_web_application
  description: "ProcessMaker is a leading open-source Business Process Management (BPM) and workflow software solution."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署。应用服务（ProcessMaker Community / PHP 5.6 Apache）与数据库服务（MariaDB 10.5）分别运行在独立的容器中，并通过 Compose 专有网络通信。"
  compose_file: docker/compose.yaml
  project_name: processmaker-community-default
  host_port: 18859
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/ProcessMaker/processmaker
    commit: dfa352c7fac2a764053fe724372738e4d5228df0
    tag: HEAD
    source_yaml: source/source.yaml

services:
  app:
    service_name: app
    role: "ProcessMaker BPM Core Web Application"
    image: yorem/processmaker-community:default@sha256:e0e7c068656faf3b49675d5e6a4bd74543f8f2a9c8a3ca77f3fa25ba832673d0
    digest: "sha256:e0e7c068656faf3b49675d5e6a4bd74543f8f2a9c8a3ca77f3fa25ba832673d0"
    platform: linux/amd64
    ports:
      - "18859:80"
    dependencies:
      - db
    healthcheck: "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"
  db:
    service_name: db
    role: "Relational Database (MariaDB 10.5)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"
    volumes:
      - db-data

credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"
