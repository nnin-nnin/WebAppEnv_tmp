application:
  name: mantisbt
  version: 2.26.2
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for MantisBT 2.26.2 bug tracker with MariaDB 10.11 database."

target:
  platform: linux/amd64
  compose_project: mantisbt-2262
  compose_file: docker/compose.yaml
  host_port: 18569
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18569/
  login_url: http://127.0.0.1:18569/login_page.php

source:
  repository: https://github.com/mantisbt/mantisbt
  fixed_ref: release-2.26.2
  immutable_commit: 4ab433bcd62ac80caded5be6f87c45942a988929
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "MantisBT includes built-in Bootstrap-based PHP frontend."

compose:
  project_name: mantisbt-2262
  services:
    - application
    - mariadb
  volumes:
    - mariadb-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/mantisbt:2.26.2@sha256:3378f42363587c99ade2ec06d4c3d8c8a09f9f9cd455b8545a4b573f16fa272a
  database_image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  - name: application
    role: "Long-running MantisBT Apache web application"
    image: yorem/mantisbt:2.26.2@sha256:3378f42363587c99ade2ec06d4c3d8c8a09f9f9cd455b8545a4b573f16fa272a
    digest: sha256:3378f42363587c99ade2ec06d4c3d8c8a09f9f9cd455b8545a4b573f16fa272a
    platform: linux/amd64
    source: "https://github.com/mantisbt/mantisbt release-2.26.2 commit 4ab433bcd62ac80caded5be6f87c45942a988929"
    ports:
      - "18569:80"
    depends_on:
      - mariadb: service_healthy
    healthcheck: "curl -f -L http://127.0.0.1:80/login_page.php || exit 1"

  - name: mariadb
    role: "MariaDB database service"
    image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    digest: sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    platform: linux/amd64
    source: "Official MariaDB 10.11 image from Docker Hub"
    healthcheck: "mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"

initialization:
  database: "Automated schema initialization via MariaDB entrypoint and pre-configured config_inc.php."
  idempotence: "Checks for existing database tables and config_inc.php file."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: administrator
    password: root
    email: root@localhost
    role: administrator
    creation_method: "Seeded into mantis_user_table during initialization"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - source_checksum
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, mariadb and application containers report healthy status."

known_limits:
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native multi-container Docker Compose environment. The application service runs MantisBT on Apache/PHP 8.3 and connects to MariaDB 10.11 container via Compose networking."
