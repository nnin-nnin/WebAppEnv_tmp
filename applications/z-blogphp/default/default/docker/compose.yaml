name: z-blogphp_default_default

services:
  app:
    image: yorem/z-blogphp:default@sha256:0ba3c425f4995fa1e6edcbf783ef6bb3d3fea93384e57675371d08f45f67534d
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18878}:80"
    environment:
      DB_HOST: db
      DB_NAME: zblog
      DB_USER: zblog
      DB_PASSWORD: AdminPassword123!
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/zb_system/login.php || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: AdminPassword123!
      MYSQL_DATABASE: zblog
      MYSQL_USER: zblog
      MYSQL_PASSWORD: AdminPassword123!
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -pAdminPassword123! || mysqladmin ping -h localhost -u root -pAdminPassword123! || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
