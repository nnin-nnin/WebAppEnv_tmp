name: thredded-default

services:
  application:
    image: yorem/thredded:default@sha256:124d76ac0c9a651ee2fbfe8846cdb9f05f47ef742cd965fcb8751eb8e5e704a8
    platform: linux/amd64
    ports:
      - "18870:3000"
    environment:
      - RAILS_ENV=production
      - RACK_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      - SECRET_KEY_BASE=c5b706c483a9ee69a5e4d2bf8bfef6b64771cfbb125fbe3d221aa90989f635cce834ef19a008c2a8626f21bc9e96e5d26febe7198bb6f50c0571c367ad3a824e
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=thredded_production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/thredded_production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thredded_production
    volumes:
      - database-data:/var/lib/postgresql/data
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thredded_production || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  database-data:
