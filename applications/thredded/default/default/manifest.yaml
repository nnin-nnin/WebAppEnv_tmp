id: thredded_default
application: thredded
version: default
artifact_type: ready_application_environment
status: native_compose_ready
application_type: complete_web_application
deployment_mode: native_compose
deployment_statement: "This is a native multi-container Docker Compose deployment. Thredded forum application and PostgreSQL database run in independent containers and communicate through the Compose network."

documentation:
  readme: README.md
  compose_file: docker/compose.yaml
  recommended_start: "docker compose -f docker/compose.yaml pull && docker compose -f docker/compose.yaml up -d"

compose:
  project_name: thredded-default
  standard_entrypoint: docker/compose.yaml
  service_names:
    - application
    - db
  network: "Compose-created default network; containers communicate via service names (db)"
  volumes:
    - database-data
  external_dependencies: false

source:
  backend:
    repository: https://github.com/thredded/thredded.git
    ref: main
    commit: a9c234692736070b8ac4e7dce9b6bf7d38559688
  metadata: source/source.yaml

runtime:
  platform: linux/amd64
  language: ruby
  framework: rails
  server: puma
  database: postgresql
  database_version: "16"
  public_url: http://127.0.0.1:18870/
  host_port: 18870
  container_port: 3000

ports:
  host_port: 18870
  container_port: 3000

credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!

services:
  application:
    image: yorem/thredded:default@sha256:124d76ac0c9a651ee2fbfe8846cdb9f05f47ef742cd965fcb8751eb8e5e704a8
    tag: default
    digest: sha256:124d76ac0c9a651ee2fbfe8846cdb9f05f47ef742cd965fcb8751eb8e5e704a8
    platform: linux/amd64
    ports:
      - 18870:3000
    depends_on:
      db: service_healthy

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    tag: "16-alpine"
    digest: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64

delivery:
  mode: DOCKERHUB
  registry: docker.io
  namespace: yorem
  registry_images:
    application: yorem/thredded:default
    db: postgres:16-alpine

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

initial_account:
  username: admin@example.com
  password: AdminPassword123!
  role: administrator
  creation: "Initialized via resources/database-seed.sql into users table with admin=true."
