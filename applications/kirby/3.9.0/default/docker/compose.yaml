name: kirby-390

services:
  application:
    image: yorem/kirby:3.9.0@sha256:355d2f21fae6975c1c9f01009f403b3bacff88d7657f5fd4e517c03756fae56c
    platform: linux/amd64
    ports:
      - "18740:80"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - kirby-data:/var/www/html
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped

volumes:
  kirby-data:
