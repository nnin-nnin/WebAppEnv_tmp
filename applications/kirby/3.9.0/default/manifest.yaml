application: kirby
version: 3.9.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/getkirby/kirby
  commit: 066b0506a81fdd331edc54add601d907a61ebbb4
runtime:
  php: "8.5"
  web_server: apache
  database: flat-file
ports:
  host_port: 18740
  container_port: 80
credentials:
  admin_username: admin
  admin_password: benchmark-only
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/kirby:3.9.0@sha256:355d2f21fae6975c1c9f01009f403b3bacff88d7657f5fd4e517c03756fae56c
    tag: 3.9.0
    digest: sha256:355d2f21fae6975c1c9f01009f403b3bacff88d7657f5fd4e517c03756fae56c
    platform: linux/amd64
