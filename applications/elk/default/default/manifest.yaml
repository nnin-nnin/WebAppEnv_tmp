application: elk
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/deviantony/docker-elk
  commit: 16f6720f7100ec1d0c9c8b3e0fa0079fa895eb92

runtime:
  language: java/nodejs
  engine: elasticsearch/kibana

ports:
  host_port: 18821
  container_port: 5601

credentials:
  admin_username: elastic
  admin_password: changeme

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  kibana:
    image: yorem/elk:default-kibana@sha256:0209a5433ed49346858507bdccca1c5afc99a540f34f0d8a86eca8197ddd8aca
    tag: default-kibana
    digest: sha256:0209a5433ed49346858507bdccca1c5afc99a540f34f0d8a86eca8197ddd8aca
    platform: linux/amd64
  elasticsearch:
    image: yorem/elk:default-elasticsearch@sha256:7053b3979a1dd709f2a225d52bc53622714790b13d88cf08164d252291ab8b61
    tag: default-elasticsearch
    digest: sha256:7053b3979a1dd709f2a225d52bc53622714790b13d88cf08164d252291ab8b61
    platform: linux/amd64
