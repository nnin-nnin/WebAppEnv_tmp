name: misp-default-default

services:
  application:
    image: yorem/misp:default@sha256:02fcca47635f0128d2d0ddc451d63ac12c6c819775713588f0a6d53840e70721
    platform: linux/amd64
    ports:
      - "18843:80"
    environment:
      - "BASEURL=http://127.0.0.1:18843"
      - "REDIS_FQDN=redis"
      - "INIT=true"
      - "CRON_USER_ID=1"
      - "MYSQL_HOST=db"
      - "MYSQL_PORT=3306"
      - "MYSQL_USER=misp"
      - "MYSQL_PASSWORD=misppassword"
      - "MYSQL_DATABASE=misp"
      - "NOREDIR=true"
      - "DISIPV6=true"
      - "SECURESSL=true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - application-files:/var/www/MISP/app/files
      - application-logs:/var/www/MISP/app/tmp/logs
      - ./custom-entrypoint.sh:/custom-entrypoint.sh:ro
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: misppassword
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine@sha256:b362b5dff9d14d961dc3352db4776aba6a8c53ca2661d7c74ad2c121f82cdaea
    platform: linux/amd64
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  application-files:
  application-logs:
  database-data:
  redis-data:
