id: dotplant2_default
application: dotplant2
version: default
artifact_type: ready_application_environment
status: native_compose_ready
application_type: complete_web_application
deployment_mode: native_compose
deployment_statement: "This is a native multi-container Docker Compose deployment. DotPlant2 application and MariaDB database run in independent containers and communicate through the Compose network."

documentation:
  readme: README.md
  compose_file: docker/compose.yaml
  recommended_start: "docker compose -f docker/compose.yaml pull && docker compose -f docker/compose.yaml up -d"

compose:
  project_name: dotplant2-default
  standard_entrypoint: docker/compose.yaml
  service_names:
    - application
    - db
  network: "Compose-created default network; containers communicate via service names (db)"
  volumes:
    - application-data
    - database-data
  external_dependencies: false

source:
  backend:
    repository: https://github.com/DevGroup-ru/dotplant2
    ref: master
    commit: fee86c7052c227762c7325eb5c2811d9323f8429
  metadata: source/source.yaml

runtime:
  platform: linux/amd64
  language: php
  php_version: "7.2"
  server: apache
  database: mariadb
  database_version: "10.5"
  public_url: http://127.0.0.1:18818/
  host_port: 18818
  container_port: 80

ports:
  host_port: 18818
  container_port: 80

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

services:
  application:
    image: yorem/dotplant2:default@sha256:612ee7e09957dd13d327cd665f99ea6706571858eaf96696b63926c1ffb7f5eb
    tag: default
    digest: sha256:612ee7e09957dd13d327cd665f99ea6706571858eaf96696b63926c1ffb7f5eb
    platform: linux/amd64
    ports:
      - 18818:80
    depends_on:
      db: service_healthy

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64

delivery:
  mode: DOCKERHUB
  registry: docker.io
  namespace: yorem
  registry_images:
    application: yorem/dotplant2:default
    db: mariadb:10.5

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

initial_account:
  username: admin
  password: AdminPassword123!
  role: administrator
  creation: "Initialized via resources/database-seed.sql into user and auth_assignment tables with bcrypt password hash and full administrator permissions."
