name: dotplant2-default

services:
  application:
    image: yorem/dotplant2:default@sha256:612ee7e09957dd13d327cd665f99ea6706571858eaf96696b63926c1ffb7f5eb
    platform: linux/amd64
    ports:
      - "18818:80"
    environment:
      - DB_HOST=db
      - DB_NAME=dotplant2
      - DB_USER=dotplant2
      - DB_PASSWORD=dotplant2password
      - DP2_SERVER_NAME=127.0.0.1
      - DP2_SERVER_PORT=18818
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application-data:/app/web/upload
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dotplant2
      MYSQL_USER: dotplant2
      MYSQL_PASSWORD: dotplant2password
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  application-data:
  database-data:
