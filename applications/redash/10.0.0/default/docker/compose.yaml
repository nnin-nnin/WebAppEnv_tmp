name: redash_10_0_0_default

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - redash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 2s

  init:
    image: yorem/redash:10.0.0@sha256:9392753c03767453f3a803eea0f6f57b52163dac8814dd13a1724dc4037132cf
    platform: linux/amd64
    restart: "no"
    command: >
      bash -c "
      /app/bin/docker-entrypoint create_db &&
      /app/manage.py users create_root admin@example.com admin --password 'AdminPassword123!' || true
      "
    environment:
      PYTHONUNBUFFERED: "0"
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      REDASH_COOKIE_SECRET: "redash_cookie_secret_68461746284618246182"
      REDASH_SECRET_KEY: "redash_secret_key_849204820482048204820"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  server:
    image: yorem/redash:10.0.0@sha256:9392753c03767453f3a803eea0f6f57b52163dac8814dd13a1724dc4037132cf
    platform: linux/amd64
    restart: unless-stopped
    command: server
    ports:
      - "18610:5000"
    environment:
      PYTHONUNBUFFERED: "0"
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      REDASH_COOKIE_SECRET: "redash_cookie_secret_68461746284618246182"
      REDASH_SECRET_KEY: "redash_secret_key_849204820482048204820"
      REDASH_WEB_WORKERS: 4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  redash_db_data:
