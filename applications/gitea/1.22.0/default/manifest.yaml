application:
  name: gitea
  version: 1.22.0
  type: full_web_application
  description: "Gitea is a painless self-hosted Git service written in Go."

deployment:
  mode: native_compose
  notes: "Native Compose application deployment for Gitea 1.22.0."
  compose_file: docker/compose.yaml
  project_name: gitea-1-22-0
  host_port: 18655
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/go-gitea/gitea
    commit: 803b0c9ab43f809e47f42fad951e7f5fb6652e42
    tag: v1.22.0
    source_yaml: source/source.yaml
  official_compose_source: https://github.com/go-gitea/gitea/blob/v1.22.0/Dockerfile

services:
  app:
    service_name: app
    role: "Gitea Git Service & Web Interface"
    image: yorem/gitea:1.22.0@sha256:ff5addffde6abf6e57a7def08f45281eab2a86d2ff6cd92ac88ff84263a87547
    digest: "sha256:ff5addffde6abf6e57a7def08f45281eab2a86d2ff6cd92ac88ff84263a87547"
    platform: linux/amd64
    ports:
      - "18655:3000"
    dependencies: []
    healthcheck: "curl -f -s http://127.0.0.1:3000/"
    volumes:
      - gitea-data

delivery_method: DOCKERHUB
dockerhub_namespace: yorem

credentials:
  admin_username: admin
  admin_password: Admin123456!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "./scripts/up.sh"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin Admin123456!"
  reset: "./scripts/reset.sh"

differences_from_official:
  - "Configured GITEA__security__INSTALL_LOCK=true to provide ready-to-use self-hosted Git platform without manual install wizard."
  - "Automated initial administrator initialization (admin / Admin123456!) via Gitea CLI and SQLite."

known_limitations:
  - "ARM64 host running linux/amd64 container may display platform emulation notices; functional execution is unaffected."
