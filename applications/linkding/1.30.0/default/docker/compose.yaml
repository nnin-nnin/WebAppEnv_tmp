name: linkding_1_30_0_default

services:
  app:
    image: yorem/linkding:1.30.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18694:9090"
    environment:
      - LD_SUPERUSER_NAME=admin
      - LD_SUPERUSER_PASSWORD=Admin123456!
    volumes:
      - linkding_data:/etc/linkding/data

volumes:
  linkding_data:
