application:
  name: OpenCart
  version: 4.0.2-3
  type: full-web-application
  source_repository: https://github.com/opencart/opencart.git
  source_commit: 139d890ee24bdafeb055534c2f0de923e4250e83
  frontend_repository: null
  frontend_commit: null
  fetched_at: 2026-08-06

platform:
  target: linux/amd64

runtime:
  language: PHP 8.2
  web_server: Apache httpd 2.4 from php:8.2-apache
  database: MariaDB 10.11 from Debian package in the built image
  frontend_build_command: none; OpenCart 4.0.2-3 ships its browser assets in the fixed source
  static_assets: source/opencart/upload/catalog/view and source/opencart/upload/admin/view
  browser_entrypoint: http://localhost:18523/
  admin_entrypoint: http://localhost:18523/admin/

delivery:
  external_port: 18523
  image: asteriskax001/sop-opencart:4.0.2-3
  image_metadata: image/image.json
  mode: single-image-single-container-all-in-one
  components:
    - OpenCart storefront
    - OpenCart Administrator backend
    - PHP 8.2 with mysqli, curl, gd, mbstring and zip
    - Apache HTTP server
    - MariaDB database service bound to 127.0.0.1 inside the container
    - OpenCart schema and initial catalog data
    - Initial Administrator account created during the image build
  database_connection: 127.0.0.1 / localhost inside the same container; no external database service
  frontend_api_connection: same-origin PHP routes served by Apache in the same container
  runtime_network_downloads: none

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  register: resources/register.sh
  initial_data: resources/initial-data/database-seed.sql

scripts:
  build: scripts/build.sh
  start: scripts/up.sh
  entrypoint: scripts/entrypoint.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

recommended_run:
  - docker run -d -p 18523:80 asteriskax001/sop-opencart:4.0.2-3

credentials:
  initial_username: admin
  initial_password: controlled-channel-only
  password_storage: not present in this manifest or any delivery text
source_metadata_file: source/source.yaml
source_availability: upstream_repository_only
