name: gallery-default

services:
  web:
    image: yorem/gallery:default@sha256:71f419a1b59684a1464ff52de2b53d823dfe9f668f00b0e13554013164c2e705
    platform: linux/amd64
    ports:
      - "18827:80"
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=gallery
      - DB_PASSWORD=gallery_password
      - DB_NAME=gallery

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=gallery
      - MYSQL_USER=gallery
      - MYSQL_PASSWORD=gallery_password
      - MYSQL_ROOT_PASSWORD=gallery_root_password
    volumes:
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/database-seed.sql:ro
      - gallery-db:/var/lib/mysql

volumes:
  gallery-db: {}
