application:
  name: Gallery
  version: default
  type: full_web_application
  description: "Gallery is an open source web based photo album organizer."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署。应用服务（Gallery 3 / PHP 5.6 Apache）与数据库服务（MariaDB 10.5）分别运行在独立的容器中，并通过 Compose 专有网络通信。"
  compose_file: docker/compose.yaml
  project_name: gallery_default
  host_port: 18827
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/gallery/gallery3.git
    commit: c7c18b125662f3e2f10ed5eb41fe21b69c2d4d82
    tag: HEAD
    source_yaml: source/source.yaml

services:
  web:
    service_name: web
    role: "Web Application & PHP Runtime"
    image: yorem/gallery:default@sha256:71f419a1b59684a1464ff52de2b53d823dfe9f668f00b0e13554013164c2e705
    digest: "sha256:71f419a1b59684a1464ff52de2b53d823dfe9f668f00b0e13554013164c2e705"
    platform: linux/amd64
    ports:
      - "18827:80"
    dependencies:
      - db
    healthcheck: "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"
  db:
    service_name: db
    role: "Relational Database (MariaDB 10.5)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -h localhost"
    volumes:
      - gallery-db

credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"
