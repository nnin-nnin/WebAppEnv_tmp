application: plantuml
version: "1.2024.5"
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/plantuml/plantuml-server
  commit: da7e0410709079a62bab4df8975901711b314ef9
runtime:
  language: java
  server: jetty
ports:
  host_port: 18697
  container_port: 8080
