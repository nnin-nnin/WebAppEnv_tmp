name: calibre-web_0_6_21_default

services:
  app:
    image: yorem/calibre-web:0.6.21@sha256:802729966faed5e32d671cd4f92ba6196e9e754a6c0f740ce1ee9acd86b10e55
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18653:8083"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - calibre_web_config:/config
      - calibre_web_books:/books

volumes:
  calibre_web_config:
  calibre_web_books:
