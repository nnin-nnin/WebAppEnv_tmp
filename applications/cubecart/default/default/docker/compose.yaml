name: cubecart_default

services:
  app:
    image: yorem/cubecart:default@sha256:18268962fdf963163921f7dbbae92916a30d408d336e5a038ec92422d82beaee
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18812}:80"
    environment:
      CC_DB_HOST: db
      CC_DB_NAME: cubecart
      CC_DB_USER: cubecart
      CC_DB_PASSWORD: cubecart_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-cache:/var/www/html/cache
      - app-images:/var/www/html/images
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: cubecart_root_pass
      MYSQL_DATABASE: cubecart
      MYSQL_USER: cubecart
      MYSQL_PASSWORD: cubecart_pass
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -pcubecart_root_pass || mysqladmin ping -h localhost -u root -pcubecart_root_pass || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-cache:
  app-images:
  db-data:
