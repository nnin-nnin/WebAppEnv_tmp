name: vivo-moonbox_default_default

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.2@sha256:055ab3c3466c6bd72ef42f7773c5fa224db4fb7cd6a9a5588ebe46642a15abf5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
      - "_JAVA_OPTIONS=-Djdk.lang.Process.launchMechanism=vfork"
      - xpack.security.enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: AdminPassword123!
      MYSQL_DATABASE: repeater_console
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -pAdminPassword123! || mysqladmin ping -h localhost -u root -pAdminPassword123! || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    image: yorem/vivo-moonbox:default@sha256:66f9c4226a1d7f30932e31d058d9751f760f84e4fa9dfc4b54b52ced44cc04ce
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18872}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/repeater_console?characterEncoding=UTF-8&autoReconnect=true&allowMultiQueries=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "AdminPassword123!"
      CONFIG_ELASTICSEARCH_NODES: "http://elasticsearch:9200"
      SPRING_REDIS_CLUSTERNODES: "none"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/api/app/supportEnv || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

volumes:
  db-data:
  es-data:
