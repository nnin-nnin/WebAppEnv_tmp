id: x2engine_default
application: x2engine
version: default
artifact_type: ready_application_environment
status: native_compose_ready
application_type: complete_web_application
deployment_mode: native_compose
deployment_statement: "This is a native multi-container Docker Compose deployment. X2CRM (X2Engine) application and MariaDB database run in independent containers and communicate through the Compose network."

documentation:
  readme: README.md
  compose_file: docker/compose.yaml
  recommended_start: "docker compose -f docker/compose.yaml pull && docker compose -f docker/compose.yaml up -d"

compose:
  project_name: x2engine-default
  standard_entrypoint: docker/compose.yaml
  service_names:
    - application
    - db
  network: "Compose-created default network; containers communicate via service names (db)"
  volumes:
    - application-data
    - database-data
  external_dependencies: false

source:
  backend:
    repository: https://github.com/X2Engine/X2Engine
    ref: master
    commit: e2b1011a2806a3f4efeaaafb60cc70cf39e2ebed
  metadata: source/source.yaml

runtime:
  platform: linux/amd64
  language: php
  php_version: "7.4"
  server: apache
  database: mariadb
  database_version: "10.5"
  public_url: http://127.0.0.1:18875/
  host_port: 18875
  container_port: 80

ports:
  host_port: 18875
  container_port: 80

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

services:
  application:
    image: yorem/x2engine:default@sha256:01623808fe8a5969134eeb7b2bdf98daea962d2a0d90759e4d52499ebcf41e54
    tag: default
    digest: sha256:01623808fe8a5969134eeb7b2bdf98daea962d2a0d90759e4d52499ebcf41e54
    platform: linux/amd64
    ports:
      - 18875:80
    depends_on:
      db: service_healthy

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64

delivery:
  mode: DOCKERHUB
  registry: docker.io
  namespace: yorem
  registry_images:
    application: yorem/x2engine:default
    db: mariadb:10.5

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

initial_account:
  username: admin
  password: AdminPassword123!
  role: admin
  creation: "Initialized via resources/database-seed.sql into x2_users with pre-seeded md5 hash for AdminPassword123! and full administrative permissions."
