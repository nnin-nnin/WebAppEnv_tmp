name: x2engine-default

services:
  application:
    image: yorem/x2engine:default@sha256:01623808fe8a5969134eeb7b2bdf98daea962d2a0d90759e4d52499ebcf41e54
    platform: linux/amd64
    ports:
      - "18875:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=x2engine
      - MYSQL_USER=x2engine
      - MYSQL_PASSWORD=x2enginepassword
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application-data:/var/www/html/uploads
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: x2engine
      MYSQL_USER: x2engine
      MYSQL_PASSWORD: x2enginepassword
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  application-data:
  database-data:
