application: publify
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/publify/publify.git
  commit: edf863d0ac9e1b2d2527f066d2547554e9bed026

runtime:
  language: ruby
  ruby_version: "3.4"
  framework: "Ruby on Rails 7.2.4"
  server: puma
  database: mariadb
  database_version: "10.6"

ports:
  host_port: 18861
  container_port: 3000

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/publify:default@sha256:a5aefcc1b571e71de9f07c295d9952eb2b3f5d7c8ade9aa36cc1f24e4700aa11
    tag: default
    digest: sha256:a5aefcc1b571e71de9f07c295d9952eb2b3f5d7c8ade9aa36cc1f24e4700aa11
    platform: linux/amd64
  db:
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    tag: "10.6"
    digest: sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    platform: linux/amd64
