name: publify-default

services:
  application:
    image: yorem/publify:default@sha256:a5aefcc1b571e71de9f07c295d9952eb2b3f5d7c8ade9aa36cc1f24e4700aa11
    platform: linux/amd64
    ports:
      - "18861:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=AdminPassword123!
      - DB_DATABASE=publify
      - RAILS_ENV=production
      - SECRET_KEY_BASE=publify_production_secret_key_base_12345678901234567890
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_FORCE_SSL=false
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    platform: linux/amd64
    environment:
      - MARIADB_ROOT_PASSWORD=AdminPassword123!
      - MARIADB_DATABASE=publify
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -pAdminPassword123! --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  database-data:
