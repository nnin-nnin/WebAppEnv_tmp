application:
  name: ImpressCMS
  version: default
  type: full_web_application
  description: "ImpressCMS is a community developed Content Management System with high extensibility, modularity, and security."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署。应用服务（ImpressCMS / PHP 7.4 Apache）与数据库服务（MariaDB 10.5）分别运行在独立容器中，并通过专有网络相互通信。"
  compose_file: docker/compose.yaml
  project_name: impresscms-default
  host_port: 18831
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/ImpressCMS/impresscms
    commit: 5fbdbc9e44e0b60fd9f2afbe1f8ca2cf69ee9621
    tag: v2.0.3
    source_yaml: source/source.yaml

services:
  app:
    service_name: app
    role: "Web Application & PHP 7.4 Apache Runtime"
    image: yorem/impresscms:default@sha256:f30860fa08b6adafd0d24476ea3f79c13e6bd21a20c6b4200b567969f92c8f64
    digest: "sha256:f30860fa08b6adafd0d24476ea3f79c13e6bd21a20c6b4200b567969f92c8f64"
    platform: linux/amd64
    ports:
      - "18831:80"
    dependencies:
      - db
    healthcheck: "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"
  db:
    service_name: db
    role: "Relational Database (MariaDB 10.5)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"
    volumes:
      - db-data

credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"
