name: impresscms-default

services:
  app:
    image: yorem/impresscms:default@sha256:f30860fa08b6adafd0d24476ea3f79c13e6bd21a20c6b4200b567969f92c8f64
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18831}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../resources/initial-data/mainfile.php:/var/www/html/mainfile.php:ro
      - ../resources/initial-data/trust_path:/var/www/trust_path
    entrypoint:
      - /bin/bash
      - -c
      - |
        rm -rf /var/www/html/install
        chown -R www-data:www-data /var/www/trust_path /var/www/html/uploads /var/www/html/cache /var/www/html/templates_c 2>/dev/null || true
        exec docker-php-entrypoint apache2-foreground
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: AdminPassword123!
      MYSQL_DATABASE: impresscms
      MYSQL_USER: impresscms
      MYSQL_PASSWORD: AdminPassword123!
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
