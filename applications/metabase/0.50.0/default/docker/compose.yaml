name: metabase-0-50-0

services:
  app:
    image: yorem/metabase:0.50.0@sha256:9bb2fc209d2957d8e459e5818ff60dfcd23322c74c18e4da1f591e56b8ea4ca2
    platform: linux/amd64
    ports:
      - "18652:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_ANON_TRACKING_ENABLED=false
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  metabase-data:
