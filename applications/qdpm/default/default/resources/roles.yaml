roles:
  - name: administrator
    permissions:
      - allow_manage_users
      - allow_manage_configuration
      - allow_manage_projects
      - allow_manage_tasks
      - allow_manage_tickets
      - allow_manage_discussions
    purpose: "Full administrative and management access to qdPM"
    associated_accounts:
      - admin@localhost.com
      - admin
  - name: developer
    permissions:
      - allow_manage_projects
      - allow_manage_tasks
    purpose: "Project and task development permissions"
    associated_accounts: []
  - name: client
    permissions:
      - view_projects
      - view_tickets
    purpose: "Client viewing and ticket submission permissions"
    associated_accounts: []
