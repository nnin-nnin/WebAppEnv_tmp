name: qdpm-default

services:
  application:
    image: yorem/qdpm:default@sha256:64bc154f4182a3b6edbfb1d2727d3979e0e1894f2fc9a979ff409084f08db7f8
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: qdpm
      DB_USER: qdpm
      DB_PASS: benchmark-only
    ports:
      - "${HOST_PORT:-18862}:80"
    volumes:
      - qdpm-cache:/var/www/html/core/cache
      - qdpm-uploads:/var/www/html/uploads
      - qdpm-backups:/var/www/html/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1/index.php/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: benchmark-only-root
      MYSQL_DATABASE: qdpm
      MYSQL_USER: qdpm
      MYSQL_PASSWORD: benchmark-only
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  qdpm-cache:
  qdpm-uploads:
  qdpm-backups:
  db-data:
