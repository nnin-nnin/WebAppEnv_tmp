application: pimcore
version: "default"
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/pimcore/pimcore.git
  commit: e6a157f8af56e4de7b88eedd0da89b669203d9b5
runtime:
  language: php
  server: apache
ports:
  host_port: 18857
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/pimcore:default@sha256:c36ce1a36e28edac459c176465fcae502d27acc6493b022c794654327b451948
    tag: "default"
    digest: sha256:c36ce1a36e28edac459c176465fcae502d27acc6493b022c794654327b451948
    platform: linux/amd64
  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
