name: canvaslms-default

services:
  canvaslms:
    image: yorem/canvaslms:default@sha256:62316ba6c213db3d82a21b1d0bb33e7d667cc1de66cb49e3846ec684b93c2e53
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18805}:80"
    environment:
      - RAILS_ENV=production
      - CG_ENVIRONMENT=local
      - CG_HTTP_PORT=80
      - CG_HTTPS_PORT=80
      - APP_DOMAIN=localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/login/canvas || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s

  db:
    image: postgres:12@sha256:2f2a8c2a7d10862e7fba2602e304523554f9df8244c632dafe2628ccb398fb5c
    platform: linux/amd64
    environment:
      - POSTGRES_USER=canvas
      - POSTGRES_PASSWORD=canvaspassword
      - POSTGRES_DB=canvas_production
    volumes:
      - ../resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas_production || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
