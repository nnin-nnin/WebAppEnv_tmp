application: asgardcms
version: 1.0.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/AsgardCms/Platform
  commit: eac01b9042ab4d8dbf79b8ae5440d9d7875d2555
runtime:
  php: '7.4'
  web_server: php-built-in
  database: sqlite
ports:
  host_port: 18757
  container_port: 80
credentials:
  admin_username: admin@admin.com
  admin_password: password
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  application:
    image: yorem/asgardcms:1.0.0@sha256:5bd9c1ac94fb60d0de01b34c935e6a22aa2601ce145f7d4101091eadf57a1ad0
    tag: 1.0.0
    digest: sha256:5bd9c1ac94fb60d0de01b34c935e6a22aa2601ce145f7d4101091eadf57a1ad0
    platform: linux/amd64
