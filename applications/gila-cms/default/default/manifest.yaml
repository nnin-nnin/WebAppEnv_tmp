application:
  name: Gila CMS
  version: default
  type: full_web_application
  description: "An open-source PHP framework and Content Management System designed for speed, flexibility, and ease of use."

deployment:
  mode: native_compose
  notes: "该环境采用原生多容器 Docker Compose 编排部署，Web 应用服务（PHP 8.1 Apache）与关系型数据库（MariaDB 10.6）运行在独立容器并通过专有网络互联。"
  compose_file: docker/compose.yaml
  project_name: gila-cms-default
  host_port: 18828
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/GilaCMS/gila
    commit: 03717370d4cb456aacb5f5df5eb806b3679764b6
    tag: default
    source_yaml: source/source.yaml
  official_compose_source: https://github.com/GilaCMS/gila/blob/master/Dockerfile

services:
  app:
    service_name: app
    role: "Web Application & PHP Runtime"
    image: yorem/gila-cms:default@sha256:d8b2d5e4255e1b83bfbf40db38d513376337b9be62b5e0eceb7c08918326d9db
    digest: "sha256:d8b2d5e4255e1b83bfbf40db38d513376337b9be62b5e0eceb7c08918326d9db"
    platform: linux/amd64
    ports:
      - "18828:80"
    dependencies:
      - db
    healthcheck: "curl -f http://localhost:80/"
    volumes:
      - gila-data
      - gila-log
      - gila-tmp
  db:
    service_name: db
    role: "Relational Database (MariaDB)"
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    digest: "sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "healthcheck.sh --connect --innodb_initialized"
    volumes:
      - database-data

credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!
  admin_alias: admin
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin@example.com AdminPassword123!"
  reset: "./scripts/reset.sh"

differences_from_official:
  - "基础镜像采用官方 php:8.1-apache，支持现代 PHP 特性并解决旧版 Ubuntu 18.04 依赖过时问题。"
  - "在 PHP 运行配置中显式关闭 Zend OPcache (opcache.enable=0)，彻底消除 macOS ARM64 QEMU/Rosetta 模拟器下的 SIGSEGV 崩溃。"
  - "引入独立的 MariaDB 10.6 容器服务，并通过 resources/initial-data/database-seed.sql 预填充全量数据表与初始管理员账户，实现零安装向导的即启即用冷启动。"

known_limitations:
  - "ARM64 宿主机上运行 linux/amd64 容器可能会出现 Docker 平台警告，但不影响功能正常运行。"
