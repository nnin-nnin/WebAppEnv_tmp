application: shaarli
version: "0.13.0"
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/shaarli/Shaarli
  commit: df121586c1814ce624afea14c80b3144363d49b8
runtime:
  php: "8.4"
  web_server: nginx
  database: flatfile
ports:
  host_port: 18664
  container_port: 80
credentials:
  admin_username: admin
  admin_password: Admin123456!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/shaarli:0.13.0@sha256:d9e03768bbd8aa91e2aa25ac65ce8ae89d485e368b4ee951f05e7058fc9195a2
    tag: "0.13.0"
    digest: sha256:d9e03768bbd8aa91e2aa25ac65ce8ae89d485e368b4ee951f05e7058fc9195a2
    platform: linux/amd64
