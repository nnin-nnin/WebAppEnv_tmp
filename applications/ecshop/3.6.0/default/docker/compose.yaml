name: ecshop-3-6-0

services:
  db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecshop
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - db_data:/var/lib/mysql
      - ../resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    image: yorem/ecshop:3.6.0@sha256:bcdce78534f8d40c446f39119436f3b1903a759c3fa4c849fc60b5b74d03d925
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18645}:80"
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        rm -f /var/www/html/temp/static_caches/shop_config.php
        exec docker-php-entrypoint apache2-foreground
    volumes:
      - ../resources/config.php:/var/www/html/data/config.php:ro
      - ../resources/install.lock:/var/www/html/data/install.lock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  db_data:
