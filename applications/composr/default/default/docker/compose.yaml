name: composr-default

services:
  application:
    image: yorem/composr:default@sha256:cce6cb3de8b8b4befbcb40dcd81f40c203f137032b784f2e0d3813b08ba6bde2
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: composr
      DB_USER: composr
      DB_PASS: composr_password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminPassword123!
      ADMIN_EMAIL: admin@example.com
      DOMAIN: 127.0.0.1:18808
    ports:
      - "${HOST_PORT:-18808}:80"
    volumes:
      - composr-data:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: composr_root_password
      MYSQL_DATABASE: composr
      MYSQL_USER: composr
      MYSQL_PASSWORD: composr_password
    volumes:
      - composr-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  composr-data:
  composr-db-data:
