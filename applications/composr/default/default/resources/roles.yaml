roles:
  - name: administrator
    permissions:
      - admin_zone_access
      - full_control
      - manage_users
      - manage_configuration
      - manage_content
    purpose: "Full administrative access to Composr CMS"
    associated_accounts:
      - admin
  - name: member
    permissions:
      - submit_content
      - view_content
    purpose: "Standard authenticated member role"
    associated_accounts: []
  - name: guest
    permissions:
      - view_content
    purpose: "Unauthenticated guest role"
    associated_accounts: []
