application: pootle
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/translate/pootle
  commit: 5a35cc958e9b65bd762433880b862c3838311894

runtime:
  language: python:2.7
  framework: django:1.10.8
  database: postgresql:9.4
  cache: redis:7

ports:
  host_port: 18858
  container_port: 8000

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/init.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/pootle:default@sha256:29eecaacdcd7d246f9a6d205c15bdea91c5fb63a03f716e0cc2aa55fe2b065e4
    tag: default
    digest: sha256:29eecaacdcd7d246f9a6d205c15bdea91c5fb63a03f716e0cc2aa55fe2b065e4
    platform: linux/amd64
  db:
    image: yorem/pootle:default-db@sha256:b5377667cb404e1299a5a13136bf28b85c78a701f2071a247c0239b4ce28978f
    tag: default-db
    digest: sha256:b5377667cb404e1299a5a13136bf28b85c78a701f2071a247c0239b4ce28978f
    platform: linux/amd64
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    tag: 7-alpine
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
