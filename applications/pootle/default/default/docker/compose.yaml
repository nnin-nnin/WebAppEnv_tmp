name: pootle-default-default

services:
  db:
    image: yorem/pootle:default-db@sha256:b5377667cb404e1299a5a13136bf28b85c78a701f2071a247c0239b4ce28978f
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: pootle
      POSTGRES_PASSWORD: CHANGEME
      POSTGRES_DB: pootledb
    networks:
      default:
        aliases:
          - postgres
          - db
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pootle -d pootledb"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  app:
    image: yorem/pootle:default@sha256:29eecaacdcd7d246f9a6d205c15bdea91c5fb63a03f716e0cc2aa55fe2b065e4
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18858:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pootle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminPassword123!
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/accounts/login/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  db-data:
  redis-data:
