application: eccube3
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/EC-CUBE/ec-cube
  commit: 7abd390a53d5b6c7ce922057a54ae722bc902522
runtime:
  php: "5.4"
  web_server: nginx
  database: sqlite
ports:
  host_port: 18820
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  web:
    image: yorem/eccube3:default@sha256:b9b4724736400a51a8ff1db5f6bf8cd49a60aeb19095c75dc10ddd16ce7cdbc1
    tag: default
    digest: sha256:b9b4724736400a51a8ff1db5f6bf8cd49a60aeb19095c75dc10ddd16ce7cdbc1
    platform: linux/amd64
