application: Supermarket
version: 5.3.7
type: Web
deployment_mode: native_compose
compose_project_name: supermarket-5.3.7
compose_file: docker/compose.yaml
official_compose:
  source: https://github.com/chef/supermarket/blob/main/src/supermarket/docker compose.yml
  status: Dev environment dependencies only. The official compose file only includes
    Postgres and Redis, lacking the application itself. The application depends on
    external Chef Server oc-id for auth. This environment builds the app from source
    and uses OmniAuth test_mode to mock the OAuth2 login.
source:
  backend:
    repository: https://github.com/chef/supermarket
    commit: 95f7060818fedb049a77d84d81bdb2e5fb3a79ed
  frontend: 
services:
  application:
    name: application
    role: application server
    image: yorem/supermarket
    tag: 5.3.7
    platform: linux/amd64
    source: built locally using docker/Dockerfile
    ports:
    - 18095:80
    depends_on:
    - db
    - redis
    healthcheck: 
    volumes:
    - application-data:/app/public/system
    digest: sha256:64912e2c4d2a2853ef8680d790ca02068e8590f573e688ac04b2517c29f8bac4
  db:
    name: db
    role: database
    image: postgres
    tag: 13.19
    platform: linux/amd64
    source: docker_hub
    ports: []
    depends_on: []
    healthcheck: pg_isready -U supermarket
    volumes:
    - database-data:/var/lib/postgresql/data
    digest: sha256:4fb98c9f8967255fcd3b7b880b0ce0e37fb84ce452074692db81c4aba656125e
  redis:
    name: redis
    role: cache
    image: redis
    tag: 6.2.5
    platform: linux/amd64
    source: docker_hub
    ports: []
    depends_on: []
    healthcheck: redis-cli ping
    volumes:
    - redis-data:/data
    digest: sha256:e9a53447991cd99110cab61ac75bb72e63de87acfde382570e3369f7dc073c2c
versions:
  runtime: ruby-3.1.5
  database: postgres-13.19
  redis: redis-6.2.5
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
image_manifest: image/image.json
image_checksum: image/SHA256SUMS
resources:
- resources/users.yaml
- resources/roles.yaml
- resources/login.sh
- resources/register.sh
scripts:
  build: scripts/build.sh
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  load_images: scripts/load-images.sh
recommended_start_command: bash scripts/load-images.sh && docker compose -f docker/compose.yaml
  up -d
known_risks: The official application requires a Chef Infra Server (oc-id) to manage
  authentication and registration. Local authentication is bypassed using MOCK_AUTH
  via OmniAuth test_mode. This environment is meant for demonstration and should not
  be used in production without configuring a proper CHEF_OAUTH2 provider.
