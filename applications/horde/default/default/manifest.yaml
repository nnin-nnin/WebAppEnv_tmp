application:
  name: Horde
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for Horde Groupware default with MariaDB database."

target:
  platform: linux/amd64
  compose_project: horde-default
  compose_file: docker/compose.yaml
  host_port: 18829
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18829/
  login_url: http://127.0.0.1:18829/login.php

source:
  repository: https://github.com/horde/horde
  fixed_ref: HEAD
  immutable_commit: d6e0a0a539af2cf2a3dd0092849fc134a9af2cf8
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "Horde Groupware suite includes full portal and web application frontends."

compose:
  project_name: horde-default
  services:
    - application
    - db
  volumes:
    - application-config
    - database-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/horde:default@sha256:38503ed77e8128cfaa5e6d2d8ee3f1e049c0c6637ae7e4371c36ae20cc28837b
  database_image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml

services:
  - name: application
    role: "Long-running Horde Apache web application"
    image: yorem/horde:default@sha256:38503ed77e8128cfaa5e6d2d8ee3f1e049c0c6637ae7e4371c36ae20cc28837b
    digest: sha256:38503ed77e8128cfaa5e6d2d8ee3f1e049c0c6637ae7e4371c36ae20cc28837b
    platform: linux/amd64
    source: "https://github.com/horde/horde commit d6e0a0a539af2cf2a3dd0092849fc134a9af2cf8 via docker/Dockerfile"
    ports:
      - "${HOST_PORT:-18829}:80"
    depends_on:
      - db: service_healthy
    healthcheck: "HTTP GET http://127.0.0.1:80/login.php inside container"

  - name: db
    role: "MariaDB database service"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB image from Docker Hub"
    healthcheck: "mysqladmin ping -h localhost -u horde -pbenchmark-only"

initialization:
  database: "Automated schema creation and admin seeding during container entrypoint initialization."
  idempotence: "Checks for existing horde_users table before initialization."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: administrator
    creation_method: "Seeded into horde_users table via container entrypoint"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  build: bash scripts/build.sh
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, db and application containers report healthy status."

known_limits:
  - "Horde default is designed for research and benchmarking."
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native multi-container Docker Compose environment, not an all-in-one image. The application service runs Horde on Apache/PHP 7.4 and connects to a separate MariaDB container via Compose networking."
