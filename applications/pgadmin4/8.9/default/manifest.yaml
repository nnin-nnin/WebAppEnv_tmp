application: pgadmin4
version: 8.9
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/pgadmin-org/pgadmin4
  commit: 7d0bbf30ec940a4501e971c59c72b0134ed4f05e
runtime:
  language: python
  server: gunicorn
ports:
  host_port: 18699
  container_port: 80
credentials:
  admin_username: admin@example.com
  admin_password: Admin123456!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/pgadmin4:8.9@sha256:33eb7d070ee7500d1513453773f61df1256fdea08257d4a3f4aebd8cf1cc87cf
    tag: "8.9"
    digest: sha256:33eb7d070ee7500d1513453773f61df1256fdea08257d4a3f4aebd8cf1cc87cf
    platform: linux/amd64
