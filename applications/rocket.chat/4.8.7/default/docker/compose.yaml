name: rocket_chat_4_8_7_default

services:
  db:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    platform: linux/amd64
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--oplogSize", "128", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'try { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"db:27017\"}]}) } catch (e) {}; if (!rs.isMaster().ismaster) { quit(1); }' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - db-data:/data/db

  app:
    image: yorem/rocket.chat:4.8.7@sha256:52ed454bcc888a26f70c73af4a3dad98d10b5580bdd27984291aea6bbd6a4736
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18647:3000"
    environment:
      - PORT=3000
      - ROOT_URL=http://127.0.0.1:18647
      - MONGO_URL=mongodb://db:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://db:27017/local?replicaSet=rs0
      - ADMIN_USERNAME=admin
      - ADMIN_NAME=Admin
      - ADMIN_EMAIL=admin@benchmark.local
      - ADMIN_PASS=Admin123456!
      - OVERWRITE_SETTING_Accounts_SystemBlockedUsernameList=
      - OVERWRITE_SETTING_Accounts_BlockedUsernameList=
      - OVERWRITE_SETTING_Show_Setup_Wizard=completed
      - Accounts_AvatarStorePath=/app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rocketchat-uploads:/app/uploads

volumes:
  db-data:
  rocketchat-uploads:
