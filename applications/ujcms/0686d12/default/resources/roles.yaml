roles:
  - name: administrator
    role_id: 1
    description: "全站最高系统管理员，具备全站全局配置、所有栏目文章、模板主题、用户与角色管理、数据备份与全局接口调用权限"
    purpose: "Primary system administration role with full access permissions (2 peer accounts: admin, admin2)"
    group_id: 8
    group_name: "管理组"
    capabilities:
      - "all_permissions"
      - "all_grant_permissions"
      - "global_permissions"
      - "all_article_permissions"
      - "all_channel_permissions"
      - "system_config_update"
      - "user_and_role_management"
    associated_accounts:
      - admin
      - admin2

  - name: standard_user
    role_id: null
    description: "标准前台业务会员用户，拥有独立数据命名空间，支持常规前台浏览、评论互动、个人资料修改、密码更新等标准业务操作"
    purpose: "Standard business member role with independent user data scope for IDOR/horizontal privilege evaluation (2 peer accounts: user1, user2)"
    group_id: 10
    group_name: "普通组"
    capabilities:
      - "browse_public_content"
      - "post_comment"
      - "manage_own_profile"
      - "change_own_password"
      - "view_own_history"
    associated_accounts:
      - user1
      - user2
