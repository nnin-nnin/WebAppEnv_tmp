application:
  name: UJCMS
  version: 0686d12
  type: full_web_application
  description: An enterprise-grade open-source content management system built with
    Spring Boot, MyBatis, Spring Security, Lucene, and Vue 3.
deployment:
  mode: native_compose
  notes: 该环境采用原生多容器 Docker Compose 编排部署，Web 应用服务（Spring Boot Java 24 JRE）与关系型数据库（MySQL
    8.0）运行在独立容器并通过专有网络互联。
  compose_file: docker/compose.yaml
  project_name: ujcms-dual
  host_port: 18081
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem
source:
  backend:
    repository: https://github.com/dromara/ujcms
    commit: 0686d1209cbb16641674f132596993dbd676cf86
    tag: default
    source_yaml: source/source.yaml
  official_compose_source: https://github.com/dromara/ujcms/blob/master/compose.yaml
services:
  app:
    service_name: app
    role: Web Application & Spring Boot Java Runtime
    image: yorem/ujcms:default@sha256:b6be619634b70707eeb7ca2e8fe6292e8702d81e2149f04e7119d7fe9aa9a297
    digest: sha256:b6be619634b70707eeb7ca2e8fe6292e8702d81e2149f04e7119d7fe9aa9a297
    platform: linux/amd64
    ports:
    - 18081:80
    dependencies:
    - db
    healthcheck: curl -f http://localhost:80/
    volumes:
    - ujcms-static
  db:
    service_name: db
    role: Relational Database (MySQL 8.0)
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    digest: sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: mysqladmin ping -h localhost -u root -pAdminPassword123!
    volumes:
    - database-data
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  admin_alias: admin
  user_password: UserPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  evaluation_matrix:
    administrator_level:
    - username: admin
      password: AdminPassword123!
      role: administrator
      dimension: vertical_admin
      peer_group: admin_group
      purpose: 主系统管理员 (拥有全站最高管理特权与配置管理权限)
    - username: admin2
      password: AdminPassword123!
      role: administrator
      dimension: horizontal_admin
      peer_group: admin_group
      purpose: 次管理员 / 同级管理员 (用于测试管理员间横向越权与日志隔离)
    standard_user_level:
    - username: user1
      password: UserPassword123!
      role: standard_user
      dimension: horizontal_user
      peer_group: standard_users
      purpose: 普通业务用户 A (拥有独立业务数据空间)
    - username: user2
      password: UserPassword123!
      role: standard_user
      dimension: horizontal_user
      peer_group: standard_users
      purpose: 普通业务用户 B (用于水平越权与 IDOR 测试)
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh
recommended_commands:
  pull: docker compose -f docker/compose.yaml pull
  up: docker compose -f docker/compose.yaml up -d
  healthcheck: ./scripts/healthcheck.sh
  login: ./resources/login.sh admin AdminPassword123!
  reset: ./scripts/reset.sh
differences_from_official:
- '主应用服务端口适配：通过配置 SERVER_PORT: 80 使得容器直接在 80 端口提供服务，完美映射宿主机专属分配端口 18081:80。'
- 数据库字符集与安全认证增强：配置 MySQL 8.0 使用 utf8mb4 字符集以及 mysql_native_password 认证方式，保证连接稳定与跨平台兼容性。
- 学术安全评测多账号体系预埋：通过 resources/db/seed-users.sql 预置精简双层双主体 4 账号矩阵（2 管理员 + 2 普通用户），满足垂直越权提权、水平越权/IDOR、管理员间横向隔离与特权审计等评测需求。
known_limitations:
- ARM64 宿主机上运行 linux/amd64 容器可能会出现 Docker 平台架构提示，但不影响应用与数据库正常运行。
