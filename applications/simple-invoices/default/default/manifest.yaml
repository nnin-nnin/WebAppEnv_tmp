id: simple-invoices_default
application: simple-invoices
version: default
artifact_type: ready_application_environment
status: native_compose_ready
application_type: complete_web_application
deployment_mode: native_compose
deployment_statement: "This is a native multi-container Docker Compose deployment. Simple Invoices application and MariaDB database run in independent containers and communicate through the Compose network."

documentation:
  readme: README.md
  compose_file: docker/compose.yaml
  recommended_start: "docker compose -f docker/compose.yaml pull && docker compose -f docker/compose.yaml up -d"

compose:
  project_name: simple-invoices-default
  standard_entrypoint: docker/compose.yaml
  service_names:
    - application
    - db
  network: "Compose-created default network; containers communicate via service names (db)"
  volumes:
    - database-data
  external_dependencies: false

source:
  backend:
    repository: https://github.com/simpleinvoices/simpleinvoices
    ref: master
    commit: eeb218732af9540a10e5f9317c794865caa50fd7
  metadata: source/source.yaml

runtime:
  platform: linux/amd64
  language: php
  php_version: "8.2"
  server: nginx
  database: mariadb
  database_version: "10.5"
  public_url: http://127.0.0.1:18865/
  host_port: 18865
  container_port: 80

ports:
  host_port: 18865
  container_port: 80

credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!

services:
  application:
    image: yorem/simple-invoices:default@sha256:e4ff18b77f43b336186f84f9612408cca8604a21dcaa0ef5afaa55617f1dde6d
    tag: default
    digest: sha256:e4ff18b77f43b336186f84f9612408cca8604a21dcaa0ef5afaa55617f1dde6d
    platform: linux/amd64
    ports:
      - 18865:80
    depends_on:
      db: service_healthy

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64

delivery:
  mode: DOCKERHUB
  registry: docker.io
  namespace: yorem
  registry_images:
    application: yorem/simple-invoices:default
    db: mariadb:10.5

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

initial_account:
  username: admin@example.com
  password: AdminPassword123!
  role: administrator
  creation: "Initialized via resources/database-seed.sql into si_user table with bcrypt password hash and full administrator permissions."
