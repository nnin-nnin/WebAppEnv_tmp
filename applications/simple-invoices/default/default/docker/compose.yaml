name: simple-invoices-default

services:
  application:
    image: yorem/simple-invoices:default@sha256:e4ff18b77f43b336186f84f9612408cca8604a21dcaa0ef5afaa55617f1dde6d
    platform: linux/amd64
    ports:
      - "18865:80"
    environment:
      - SI_DB_HOST=db
      - SI_DB_PORT=3306
      - SI_DB_NAME=simpleinvoices
      - SI_DB_USER=simpleinvoices
      - SI_DB_PASSWORD=simpleinvoicespassword
      - SI_DATABASE_ADAPTER=pdo_mysql
      - SI_DATABASE_UTF8=true
      - SI_AUTHENTICATION_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simpleinvoices
      MYSQL_USER: simpleinvoices
      MYSQL_PASSWORD: simpleinvoicespassword
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database-data:
