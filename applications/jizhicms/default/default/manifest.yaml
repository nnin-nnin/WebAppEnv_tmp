application:
  name: jizhicms
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for JiZhiCMS default with MariaDB database."

target:
  platform: linux/amd64
  compose_project: jizhicms-default
  compose_file: docker/compose.yaml
  host_port: 18835
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18835/
  login_url: http://127.0.0.1:18835/index.php/admins/Login/index.html

source:
  repository: https://github.com/Cherry-toto/jizhicms
  fixed_ref: HEAD
  immutable_commit: ff2c965c26018ae7c3fdb70f180a3b76f40bc3fe
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "JiZhiCMS includes built-in responsive frontend website and administration dashboard."

compose:
  project_name: jizhicms-default
  services:
    - application
    - db
  volumes:
    - application-data
    - database-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/jizhicms:default@sha256:d5330409f4daf686916933014036ef681db16abc3a9415db9c69547768142162
  database_image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml

services:
  - name: application
    role: "Long-running JiZhiCMS Apache PHP web application"
    image: yorem/jizhicms:default@sha256:d5330409f4daf686916933014036ef681db16abc3a9415db9c69547768142162
    digest: sha256:d5330409f4daf686916933014036ef681db16abc3a9415db9c69547768142162
    platform: linux/amd64
    source: "https://github.com/Cherry-toto/jizhicms commit ff2c965c26018ae7c3fdb70f180a3b76f40bc3fe via docker/Dockerfile"
    ports:
      - "${HOST_PORT:-18835}:80"
    depends_on:
      - db: service_healthy
    healthcheck: "HTTP GET http://127.0.0.1:80/index.php/admins/Login/index.html inside container"

  - name: db
    role: "MariaDB database service"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB image from Docker Hub"
    healthcheck: "mysqladmin ping -h localhost -u root -pbenchmark-only-root"

initialization:
  database: "Automated schema creation and admin seeding during container entrypoint initialization."
  idempotence: "Checks for existing jz_level table before initialization."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: administrator
    creation_method: "Seeded into jz_level table via container entrypoint"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  build: bash scripts/build.sh
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, db and application containers report healthy status."

known_limits:
  - "JiZhiCMS default is configured for research and security evaluation."
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native multi-container Docker Compose environment, not an all-in-one image. The application service runs JiZhiCMS on Apache/PHP 7.4 and connects to a separate MariaDB container via Compose networking."
