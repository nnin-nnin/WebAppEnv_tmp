application:
  name: akeneo
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for Akeneo PIM with MariaDB database."

target:
  platform: linux/amd64
  compose_project: akeneo-default-default
  compose_file: docker/compose.yaml
  host_port: 18801
  browser_url: http://127.0.0.1:18801/
  login_url: http://127.0.0.1:18801/user/login

source:
  repository: https://github.com/akeneo/pim-community-dev
  fixed_ref: HEAD
  commit: 77d98c30f8af96a34c9d4056c8d78146ac03a43b
  metadata: source/source.yaml

compose:
  project_name: akeneo-default-default
  services:
    - application
    - db
  volumes:
    - db-data
    - app-cache
    - app-logs

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
deployment_mode: native_compose

runtime:
  language: php:5.6
  web_server: apache
  database: mariadb:10.5

ports:
  host_port: 18801
  container_port: 80

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/init.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/akeneo:default
    tag: default
    digest: sha256:73880adda318991f8d002e12d717d80209638d5d0ca9bc2392539104308b984e
    platform: linux/amd64
  db:
    image: mariadb:10.5
    tag: 10.5
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
