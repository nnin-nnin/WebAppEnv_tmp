name: akeneo-default-default

services:
  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: akeneo_pim
      MYSQL_USER: akeneo
      MYSQL_PASSWORD: akeneo
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  application:
    image: yorem/akeneo:default@sha256:73880adda318991f8d002e12d717d80209638d5d0ca9bc2392539104308b984e
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18801:80"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: akeneo_pim
      DATABASE_USER: akeneo
      DATABASE_PASSWORD: akeneo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-cache:/akeneo/app/cache
      - app-logs:/akeneo/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sL http://127.0.0.1/ | grep -q 'Login' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  db-data:
  app-cache:
  app-logs:
