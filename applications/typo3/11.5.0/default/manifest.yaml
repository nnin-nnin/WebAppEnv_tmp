application:
  name: TYPO3
  version: 11.5.0
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for TYPO3 11.5.0 CMS with MariaDB 10.11 database."

target:
  platform: linux/amd64
  compose_project: typo3-11-5-0
  compose_file: docker/compose.yaml
  host_port: 18623
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18623/
  login_url: http://127.0.0.1:18623/typo3/

source:
  repository: https://github.com/TYPO3/typo3.git
  fixed_ref: v11.5.0
  immutable_commit: 0da4bf2966784c088931dbe7f8b23bb981bf0065
  metadata: source/source.yaml
  availability: git_only

compose:
  project_name: typo3-11-5-0
  services:
    - app
    - db
  volumes:
    - db-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/typo3:11.5.0@sha256:7436d068b583c1dae2dd37ebca973b957de5371fe2acfdf9239598c3a8dbda25
  database_image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  - name: app
    role: "TYPO3 CMS web application"
    image: yorem/typo3:11.5.0@sha256:7436d068b583c1dae2dd37ebca973b957de5371fe2acfdf9239598c3a8dbda25
    tag: 11.5.0
    digest: sha256:7436d068b583c1dae2dd37ebca973b957de5371fe2acfdf9239598c3a8dbda25
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18623}:80"
    depends_on:
      - db: service_healthy

  - name: db
    role: "MariaDB database service"
    image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    tag: 10.11
    digest: sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    platform: linux/amd64

ports:
  host_port: 18623
  container_port: 80

credentials:
  admin_username: admin
  admin_password: benchmark-only

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
