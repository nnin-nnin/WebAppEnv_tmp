application:
  name: phpwcms
  version: default
  type: full_web_application
  description: "phpwcms is a robust and flexible web-based Content Management System."

deployment:
  mode: native_compose
  notes: "该环境是原生多容器 Docker Compose 部署，不是 all-in-one 单容器部署。应用服务（Web/PHP）与数据库服务（MariaDB）分别运行在独立的容器中，并通过 Compose 专有网络通信。"
  compose_file: docker/compose.yaml
  project_name: phpwcms-default
  host_port: 18855
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/slackero/phpwcms
    commit: b8ebd5c8f2e21d187fc006fd8e9f72cfcac9c5cc
    tag: v1.12.3
    source_yaml: source/source.yaml

services:
  app:
    service_name: app
    role: "Web Application & PHP Runtime"
    image: yorem/phpwcms:default@sha256:afda9101b1aa5c2c07d3cc1056de2de03210df86fb0206fb9cd4e0dd09c2b016
    digest: "sha256:afda9101b1aa5c2c07d3cc1056de2de03210df86fb0206fb9cd4e0dd09c2b016"
    platform: linux/amd64
    ports:
      - "18855:80"
    dependencies:
      - db
    healthcheck: "curl -f http://localhost:80/login.php"
    volumes:
      - application-data
      - application-content
      - application-upload
  db:
    service_name: db
    role: "Relational Database (MariaDB)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -u root -pAdminPassword123! --silent"
    volumes:
      - database-data

credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"

differences_from_official:
  - "将运行环境配置为 PHP 8.2-apache，并在 php.ini 中关闭 opcache 保证在 macOS ARM64 及 Linux amd64 平台稳定无崩。"
  - "引入 MariaDB 10.5 作为独立数据库服务，通过 Docker Compose 专有网络连接。"
  - "预置 conf.inc.php 配置文件与初始数据库种子（database-seed.sql），包含已配置好的初始管理员账号 admin / AdminPassword123!，实现冷启动零配置直接可用。"

known_limitations:
  - "ARM64 宿主机上运行 linux/amd64 容器可能会出现 Docker 平台警告，不影响功能正常运行。"
