name: lychee-5-5-0

services:
  app:
    image: yorem/lychee:5.5.0@sha256:2361c80a8c3803f5597f0af4f7f119742accd6a14377f671d23e9543c6173fad
    platform: linux/amd64
    ports:
      - "18657:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_DATABASE=lychee
      - DB_USERNAME=lychee
      - DB_PASSWORD=benchmark-only
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123456!}
      - APP_URL=http://localhost:18657
    volumes:
      - lychee-conf:/conf
      - lychee-uploads:/uploads
      - lychee-sym:/sym
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark-only
      - MYSQL_DATABASE=lychee
      - MYSQL_USER=lychee
      - MYSQL_PASSWORD=benchmark-only
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  lychee-conf:
  lychee-uploads:
  lychee-sym:
  db-data:
