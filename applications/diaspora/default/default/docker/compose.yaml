name: diaspora_default

services:
  app:
    image: yorem/diaspora:default@sha256:706fc9b3ca713178a22d22a8bd120ea07a1f3a3cae38c329bc85779bc5bd564f
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RAILS_ENV=production
    ports:
      - "18815:80"
    volumes:
      - application-uploads:/home/diaspora/diaspora/public/uploads
      - application-tmp:/home/diaspora/diaspora/tmp
    restart: unless-stopped

  db:
    image: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
    platform: linux/amd64
    environment:
      - POSTGRES_USER=diaspora
      - POSTGRES_PASSWORD=diaspora_password
      - POSTGRES_DB=diaspora_production
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diaspora -d diaspora_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    platform: linux/amd64
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  application-uploads:
  application-tmp:
  database-data:
  redis-data:
