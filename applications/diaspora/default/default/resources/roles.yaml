roles:
  - name: admin
    role_id: 1
    description: Full pod administrator with access to user management, pod status, and administration dashboard.
    associated_accounts:
      - admin

  - name: moderator
    role_id: 2
    description: Content moderator with access to reported content queue and moderation tools.
    associated_accounts: []

  - name: spotlight
    role_id: 3
    description: Community spotlight member featured on public pod discovery pages.
    associated_accounts: []

  - name: user
    role_id: 4
    description: Regular authenticated member account capable of posting, commenting, and federating.
    associated_accounts: []

  - name: visitor
    role_id: 5
    description: Anonymous visitor with read-only access to public posts.
    associated_accounts: []
