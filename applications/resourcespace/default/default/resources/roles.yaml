roles:
  - name: "Super Admin"
    description: "Full administrative and superuser privileges across system and assets"
    purpose: "Primary system management and configuration role"
    associated_accounts:
      - admin
  - name: "Administrators"
    description: "Administrative access for asset and user management"
    purpose: "Secondary administrative role"
    associated_accounts: []
  - name: "General Users"
    description: "Standard end user with read and download capabilities"
    purpose: "Regular system user role"
    associated_accounts: []
