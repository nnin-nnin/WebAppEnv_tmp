name: resourcespace-default

services:
  app:
    image: yorem/resourcespace:default@sha256:c96bf9c9fbaaea638ad3f877d88bdad6c20bd125e091ca8beb2c1e65521555de
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-18863}:80"
    volumes:
      - app-data:/var/www/html/filestore
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/login.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: AdminPassword123!
      MYSQL_DATABASE: resourcespace
      MYSQL_USER: resourcespace
      MYSQL_PASSWORD: AdminPassword123!
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-data:
  db-data:
