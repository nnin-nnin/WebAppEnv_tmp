application:
  name: ResourceSpace
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for ResourceSpace default with MariaDB database."

target:
  platform: linux/amd64
  compose_project: resourcespace-default
  compose_file: docker/compose.yaml
  host_port: 18863
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18863/
  login_url: http://127.0.0.1:18863/login.php

source:
  repository: https://github.com/resourcespace/resourcespace
  fixed_ref: a72fb0a758a724d6efe2400b0683b33261dca6d4
  immutable_commit: a72fb0a758a724d6efe2400b0683b33261dca6d4
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "ResourceSpace includes digital asset management web interface and search portal."

compose:
  project_name: resourcespace-default
  services:
    - app
    - db
  volumes:
    - app-data
    - db-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/resourcespace:default@sha256:c96bf9c9fbaaea638ad3f877d88bdad6c20bd125e091ca8beb2c1e65521555de
  database_image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml

services:
  - name: app
    role: "ResourceSpace Web application runtime"
    image: yorem/resourcespace:default@sha256:c96bf9c9fbaaea638ad3f877d88bdad6c20bd125e091ca8beb2c1e65521555de
    digest: sha256:c96bf9c9fbaaea638ad3f877d88bdad6c20bd125e091ca8beb2c1e65521555de
    platform: linux/amd64
    source: "https://github.com/resourcespace/resourcespace commit a72fb0a758a724d6efe2400b0683b33261dca6d4 via docker/Dockerfile"
    ports:
      - "${HOST_PORT:-18863}:80"
    depends_on:
      - db: service_healthy
    healthcheck: "curl -f -s http://127.0.0.1:80/login.php"

  - name: db
    role: "MariaDB database service"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB image from Docker Hub"
    healthcheck: "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD"

initialization:
  database: "Automated schema initialization and admin seeding via /docker-entrypoint-initdb.d/01-database-seed.sql"
  idempotence: "Checks for existing schema during database creation"
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: "Super Admin"
    creation_method: "Seeded into user table via initial database seed"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  build: bash scripts/build.sh
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, db and app containers report healthy status."

known_limits:
  - "ResourceSpace default is designed for benchmark and security evaluation."
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native multi-container Docker Compose environment, not an all-in-one image. The application service runs ResourceSpace on Apache/PHP 8.2 and connects to a separate MariaDB container via Compose networking."
