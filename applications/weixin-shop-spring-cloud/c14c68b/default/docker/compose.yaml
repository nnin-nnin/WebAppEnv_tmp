name: weixin-shop-spring-cloud
services:
  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wx-shop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
      - --sql_mode=
    volumes:
      - ../resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: yorem/weixin-shop-spring-cloud:default
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18100:8086"

volumes:
  db_data:
