application: roundcube
version: 1.7.4
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/roundcube/roundcubemail
  commit: 0d05c37a6e565b1ff0f3a4472081f20a64d569a1
runtime:
  php: 8.4.25
  web_server: apache
  database: sqlite
ports:
