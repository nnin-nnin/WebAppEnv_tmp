application: pikachu
version: 0.1.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/zhuifengshaonianhanlu/pikachu.git
  commit: a5e507bd12ebe98baddba3d5aeee2dce0008d25e
runtime:
  php: '5.6'
  web_server: apache
  database: mysql
ports:
  host_port: 18764
  container_port: 80
credentials:
  admin_username: admin
  admin_password: '123456'
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  application:
    image: yorem/pikachu:0.1@sha256:e9748879af76b68235a6ec66ce28b048323ac31f7f33065d83727cacb3998e05
    tag: "0.1"
    digest: sha256:e9748879af76b68235a6ec66ce28b048323ac31f7f33065d83727cacb3998e05
    platform: linux/amd64
