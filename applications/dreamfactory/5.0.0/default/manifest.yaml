application: dreamfactory
version: 5.0.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/dreamfactorysoftware/dreamfactory
  commit: 61004db1b029f675368a344ee147cdc90f404ae7
runtime:
  php: '8.5'
  web_server: nginx
  database: sqlite
ports:
  host_port: 18597
  container_port: 80
