  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  web:
    image: yorem/dreamfactory:5.0.0
    tag: 5.0.0
    digest: sha256:1974c821d2a1eebe1d9b7ab11a9ba4d5587755a628f4e339907b6394e9757aeb
    platform: linux/amd64
