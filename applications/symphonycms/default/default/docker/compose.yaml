name: symphonycms-default

services:
  application:
    image: yorem/symphonycms:default@sha256:c1c3b45a14d150cec0669e8c136710cc47bca5d4a9de559b45a9f283b333164c
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: symphony_cms
      DB_USER: symphony
      DB_PASS: benchmark-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminPassword123!
    ports:
      - "${HOST_PORT:-18868}:80"
    volumes:
      - application-manifest:/var/www/html/manifest
      - application-workspace:/var/www/html/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/symphony/login/ || curl -f -s http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: benchmark-only-root
      MYSQL_DATABASE: symphony_cms
      MYSQL_USER: symphony
      MYSQL_PASSWORD: benchmark-only
    volumes:
      - database-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  application-manifest:
  application-workspace:
  database-data:
