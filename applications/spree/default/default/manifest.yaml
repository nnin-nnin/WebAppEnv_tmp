application: spree
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/spree/spree.git
  commit: 73a078b88b118b82ff841e6c36b067a08677abd9

runtime:
  language: ruby
  ruby_version: "4.0"
  framework: "Ruby on Rails 8.1.4"
  server: puma
  database: postgresql
  database_version: "16"

ports:
  host_port: 18866
  container_port: 3000

credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/spree:default@sha256:1c29b806fb6769ef5d4ac5a451f862457611b661fa2208b4eb431674da96b45e
    tag: default
    digest: sha256:1c29b806fb6769ef5d4ac5a451f862457611b661fa2208b4eb431674da96b45e
    platform: linux/amd64
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    tag: "16-alpine"
    digest: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64
