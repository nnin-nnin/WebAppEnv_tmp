application: NavigateCMS
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/NavigateCMS/Navigate-CMS
  commit: 1b30d869a162462dbc635693a7fd1293e55d0652
runtime:
  php: "7.4"
  web_server: apache
  database: mariadb:10.5
ports:
  host_port: 18846
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/navigatecms:default@sha256:4f5a5fdae8c1f5a51ddfae4f2145592e38f1487986138e51a2159af1f2535852
    tag: default
    digest: sha256:4f5a5fdae8c1f5a51ddfae4f2145592e38f1487986138e51a2159af1f2535852
    platform: linux/amd64
  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: 10.5
