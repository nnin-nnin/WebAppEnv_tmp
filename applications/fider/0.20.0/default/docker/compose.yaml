name: fider_0_20_0_default

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: fider
      POSTGRES_USER: fider
      POSTGRES_PASSWORD: benchmark-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fider -d fider"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    image: yorem/fider:0.20.0@sha256:a7ad1378d8db8880d4e4a3a11b1aea7107c8e7886b6412368c2706db4ffb0966
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BASE_URL: http://127.0.0.1:18675
      DATABASE_URL: postgres://fider:benchmark-only@db:5432/fider?sslmode=disable
      JWT_SECRET: benchmark-secret-key-1234567890
      HOST_DOMAIN: "127.0.0.1"
      EMAIL_NOREPLY: noreply@example.com
      EMAIL_SMTP_HOST: localhost
      EMAIL_SMTP_PORT: "25"
      EMAIL_SMTP_ENABLE_STARTTLS: "false"
    ports:
      - "18675:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
