  commit: 9049da1cb4b0d239f8b9c4b6eba1fe74ad6acb68
runtime:
  language: go
  web_server: fider
  database: postgres:15-alpine
ports:
  host_port: 18675
  container_port: 3000
credentials:
  admin_username: admin@example.com
  admin_password: Admin123456!
resources:
