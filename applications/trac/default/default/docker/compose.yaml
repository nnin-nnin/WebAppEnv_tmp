name: trac_default_default

services:
  app:
    image: yorem/trac:default@sha256:bcbe8809e3a9df7f5f0f9eff77bc97f35bdf85ed5e74ee2bb7bbc7d6322c018a
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18871:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s
