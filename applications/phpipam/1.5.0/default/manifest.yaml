application: phpipam
version: 1.5.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/phpipam/phpipam
  commit: baab8c632f4d
runtime:
  php: '8.2'
  web_server: apache
  database: mariadb
ports:
  host_port: 18544
  container_port: 80
credentials:
  admin_username: Admin
  admin_password: ipamadmin
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/phpipam:1.5.0
    tag: 1.5.0
    digest: sha256:baab8c632f4d6a7835047fababfea23401030d75e3e71fdd7df404ca05f1dcf2
    platform: linux/amd64
  db:
    image: mariadb:10.5
    tag: 10.5
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
