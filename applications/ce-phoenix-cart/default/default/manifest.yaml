application: ce-phoenix-cart
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/gburton/CE-Phoenix
  commit: 43c52c27af71ce48a35a77daa78ff640e65bbc33
runtime:
  php: "7.4"
  web_server: apache
  database: mariadb:10.5
ports:
  host_port: 18806
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  web:
    image: yorem/ce-phoenix-cart:default@sha256:e8eae01be7dccbfc83a698cfda355eaf3e8acc60cacbf0eb3154ba0839086d21
    tag: default
    digest: sha256:e8eae01be7dccbfc83a698cfda355eaf3e8acc60cacbf0eb3154ba0839086d21
    platform: linux/amd64
  db:
    image: mariadb:10.5
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
