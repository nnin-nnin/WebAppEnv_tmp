application:
  name: Neos CMS
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native Docker Compose deployment for Neos CMS default (8.3 LTS) on PHP 8.1 Apache with MariaDB 10.5 database."

target:
  platform: linux/amd64
  compose_project: neos-default
  compose_file: docker/compose.yaml
  host_port: 18847
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18847/
  login_url: http://127.0.0.1:18847/neos/login

source:
  repository: https://github.com/neos/neos
  fixed_ref: HEAD
  immutable_commit: e2a96a3990249da59586ff3ea2f1514f837d03dd
  metadata: source/source.yaml
  availability: github_only

compose:
  project_name: neos-default
  services:
    - app
    - db
  volumes:
    - neos-data
    - neos-db-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/neos:default@sha256:ac190f87f012d9b20a5d52472b1e9029d222b1d3c83260144847649ec0d89e3e

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  - name: app
    role: "Neos CMS application service running on PHP 8.1 and Apache"
    image: yorem/neos:default@sha256:ac190f87f012d9b20a5d52472b1e9029d222b1d3c83260144847649ec0d89e3e
    digest: sha256:ac190f87f012d9b20a5d52472b1e9029d222b1d3c83260144847649ec0d89e3e
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18847}:80"
    healthcheck: "curl -s -f http://127.0.0.1:80/neos/login || curl -s -f http://127.0.0.1:80/ || exit 1"

  - name: db
    role: "MariaDB relational database service with pre-seeded database schema"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    ports: []
    healthcheck: "healthcheck.sh --connect --innodb_initialized"

initialization:
  database: "Automated schema creation and admin seeding via container entrypoint and database-seed.sql."
  idempotence: "Checks database and creates admin user if missing."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: Administrator
    creation_method: "Seeded into Flow users database with Neos.Neos:Administrator role"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - source_checksum
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, both app and db containers report healthy status."

known_limits:
  - "Neos CMS default is configured for research and benchmarking."
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native Docker Compose environment running Neos CMS on PHP 8.1 Apache with MariaDB 10.5."
