Neos:
  Flow:
    persistence:
      backendOptions:
        driver: 'pdo_mysql'
        host: '%env:DB_HOST%'
        port: 3306
        dbname: '%env:DB_DATABASE%'
        user: '%env:DB_USER%'
        password: '%env:DB_PASSWORD%'
        charset: 'utf8mb4'
    http:
      trustedProxies:
        proxies: '*'
