name: fatfreecrm-default

services:
  application:
    image: yorem/fatfreecrm:default@sha256:9e727f5bf6af37bc8328f453c0a058fcfba4275dfbb4f416ff2702a5ff6d1a1b
    platform: linux/amd64
    ports:
      - "18825:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=fat_free_crm_production
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - RAILS_ENV=production
      - SECRET_KEY_BASE=fatfreecrm_secret_key_base_12345678901234567890
      - RAILS_SERVE_STATIC_FILES=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application-storage:/home/app/storage
    restart: unless-stopped

  db:
    image: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fat_free_crm_production
    volumes:
      - database-data:/var/lib/postgresql/data
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fat_free_crm_production || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  application-storage:
  database-data:
