application: fatfreecrm
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/fatfreecrm/fat_free_crm.git
  commit: 91595c40a6baaa70512296157aab4bd56009e9b5

runtime:
  language: ruby
  ruby_version: "3.4"
  framework: "Ruby on Rails 8.0.5"
  server: puma
  database: postgresql
  database_version: "14"

ports:
  host_port: 18825
  container_port: 3000

credentials:
  admin_username: admin
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/database-seed.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/fatfreecrm:default@sha256:9e727f5bf6af37bc8328f453c0a058fcfba4275dfbb4f416ff2702a5ff6d1a1b
    tag: default
    digest: sha256:9e727f5bf6af37bc8328f453c0a058fcfba4275dfbb4f416ff2702a5ff6d1a1b
    platform: linux/amd64
  db:
    image: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
    tag: "14"
    digest: sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
    platform: linux/amd64
