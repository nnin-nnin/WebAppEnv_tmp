name: nginx_proxy_manager_2_11_3

services:
  app:
    image: yorem/nginx-proxy-manager:2.11.3@sha256:22b978a376beca5e19bb0f492966185964cfb19b8717525b6246882d8c20b47b
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "18662:81"
    environment:
      - DISABLE_IPV6=true
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

volumes:
  npm_data:
  npm_letsencrypt:
