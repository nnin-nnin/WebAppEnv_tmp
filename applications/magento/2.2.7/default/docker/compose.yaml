name: magento_2_2_7_default

services:
  web:
    image: yorem/magento:2.2.7@sha256:920f0dd512a25de1992cd444d3edc56e6131f840e65ae1ba3262aa276ed5304e
    platform: linux/amd64
    ports:
      - "18636:80"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
