name: maxsite-default

services:
  application:
    image: yorem/maxsite:default@sha256:aeac4e7ab012bc5daa20bba83b8fa95701aff248dd205a1b7195dcf93399f999
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: maxsite
      DB_USER: maxsite
      DB_PASS: benchmark-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminPassword123!
      ADMIN_EMAIL: admin@example.com
      SITE_NAME: MaxSite CMS
    ports:
      - "${HOST_PORT:-18841}:80"
    volumes:
      - application-data:/var/www/html/application/cache
      - uploads-data:/var/www/html/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: benchmark-only-root
      MYSQL_DATABASE: maxsite
      MYSQL_USER: maxsite
      MYSQL_PASSWORD: benchmark-only
    volumes:
      - database-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  application-data:
  uploads-data:
  database-data:
