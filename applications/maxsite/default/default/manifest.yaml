application:
  name: MaxSite
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for MaxSite CMS default with MariaDB database."

target:
  platform: linux/amd64
  compose_project: maxsite-default
  compose_file: docker/compose.yaml
  host_port: 18841
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18841/
  login_url: http://127.0.0.1:18841/admin

source:
  repository: https://github.com/maxsite/cms
  fixed_ref: HEAD
  immutable_commit: 338f586e3ff7bb5453654e2d1c05695a65b69ba6
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "MaxSite CMS includes built-in blog templates and demo content."

compose:
  project_name: maxsite-default
  services:
    - application
    - db
  volumes:
    - application-data
    - uploads-data
    - database-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/maxsite:default@sha256:aeac4e7ab012bc5daa20bba83b8fa95701aff248dd205a1b7195dcf93399f999
  database_image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml

services:
  - name: application
    role: "Long-running MaxSite CMS Apache web application"
    image: yorem/maxsite:default@sha256:aeac4e7ab012bc5daa20bba83b8fa95701aff248dd205a1b7195dcf93399f999
    digest: sha256:aeac4e7ab012bc5daa20bba83b8fa95701aff248dd205a1b7195dcf93399f999
    platform: linux/amd64
    source: "https://github.com/maxsite/cms commit 338f586e3ff7bb5453654e2d1c05695a65b69ba6 via docker/Dockerfile"
    ports:
      - "${HOST_PORT:-18841}:80"
    depends_on:
      - db: service_healthy
    healthcheck: "HTTP GET http://127.0.0.1:80/ inside container"

  - name: db
    role: "MariaDB database service"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB image from Docker Hub"
    healthcheck: "mysqladmin ping -h localhost -u root -pbenchmark-only-root"

initialization:
  database: "Automated schema creation and admin seeding during container entrypoint initialization."
  idempotence: "Checks for existing mso_users table before initialization."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: administrator
    creation_method: "Seeded into mso_users table via container entrypoint"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, db and application containers report healthy status."

known_limits:
  - "MaxSite CMS is designed for research and benchmarking."
  - "Images target linux/amd64 platform."

consistency_statement: "This is a native multi-container Docker Compose environment, not an all-in-one image. The application service runs MaxSite CMS on Apache/PHP 7.4 and connects to a separate MariaDB container via Compose networking."
