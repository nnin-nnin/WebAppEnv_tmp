name: osclass-default

services:
  application:
    image: yorem/osclass:default@sha256:ba7734a15a7b043e7fb4f08c485485ff877fe2e25c856c6f7c100312936e8aef
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18850}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: osclass
      DB_USER: osclass
      DB_PASSWORD: osclass_password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminPassword123!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-uploads:/var/www/html/oc-content/uploads
      - app-downloads:/var/www/html/oc-content/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: osclass
      MYSQL_USER: osclass
      MYSQL_PASSWORD: osclass_password
    volumes:
      - db-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/01-database-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot_password || mysqladmin ping -h localhost -u root -proot_password || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-uploads:
  app-downloads:
  db-data:
