application:
  name: Osclass
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native multi-container Docker Compose deployment for Osclass default with MariaDB 10.5 database."

target:
  platform: linux/amd64
  compose_project: osclass-default
  compose_file: docker/compose.yaml
  host_port: 18850
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18850/
  login_url: http://127.0.0.1:18850/oc-admin/index.php

source:
  repository: https://github.com/osclass/Osclass
  fixed_ref: master
  immutable_commit: b1c67a2bd623748a3090b66d8ac5a0baf78172c8
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "Osclass includes default themes and responsive classifieds frontend."

compose:
  project_name: osclass-default
  services:
    - application
    - db
  volumes:
    - app-uploads
    - app-downloads
    - db-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/osclass:default@sha256:ba7734a15a7b043e7fb4f08c485485ff877fe2e25c856c6f7c100312936e8aef
  database_image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  - name: application
    role: "Long-running Osclass Apache/PHP web application"
    image: yorem/osclass:default@sha256:ba7734a15a7b043e7fb4f08c485485ff877fe2e25c856c6f7c100312936e8aef
    digest: sha256:ba7734a15a7b043e7fb4f08c485485ff877fe2e25c856c6f7c100312936e8aef
    platform: linux/amd64
    source: "https://github.com/osclass/Osclass commit b1c67a2bd623748a3090b66d8ac5a0baf78172c8 via docker/Dockerfile"
    ports:
      - "${HOST_PORT:-18850}:80"
    depends_on:
      - db: service_healthy
    healthcheck: "HTTP GET http://127.0.0.1:80/ inside container"

  - name: db
    role: "MariaDB 10.5 database service"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    source: "Official MariaDB image from Docker Hub"
    healthcheck: "mariadb-admin ping -h localhost -u root -proot_password"

initialization:
  database: "Automated schema initialization and admin seeding via /docker-entrypoint-initdb.d/01-database-seed.sql"
  idempotence: "Checks for existing schema, admin account, and database tables."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: AdminPassword123!
    email: admin@example.com
    role: administrator
    creation_method: "Pre-seeded into oc_t_admin table via initial-data database seed"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  build: bash scripts/build.sh
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - source_checksum
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, db and application containers report healthy status."

known_limits:
  - "Osclass default targets linux/amd64 platform on PHP 7.4 Apache."
  - "OPCache is disabled in php.ini for stability under ARM64 emulation."

consistency_statement: "This is a native multi-container Docker Compose environment, not an all-in-one image. The application service runs Osclass on Apache/PHP 7.4 and connects to a separate MariaDB container via Compose networking."
