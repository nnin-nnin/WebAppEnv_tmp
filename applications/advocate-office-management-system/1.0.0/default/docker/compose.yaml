name: advocate-office-1.0.0

services:
  app:
    image: yorem/advocate-office:1.0.0@sha256:0b66490ac63c09ca9332f9ba6cb48b27d322e8cc1602c60f6a7f259ad15c365f
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: benchmark-only
      DB_NAME: advocate1
    ports:
      - "18004:80"
    restart: unless-stopped

  db:
    image: mysql:8.0.36@sha256:65ce0889751900d2dd5fc5aa5a5fb59073d401fc43df2eae6bd6afb18e7626dd
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: benchmark-only
      MYSQL_DATABASE: advocate1
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/initial-data/database-seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pbenchmark-only"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  database-data:
