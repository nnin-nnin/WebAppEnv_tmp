application: kityminder
version: 1.4.50
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/fex-team/kityminder
  commit: e0ef0726527ed6bba14b2771c8ec2ce703e3ab20
runtime:
  php: '7.1'
  web_server: apache
ports:
  host_port: 18640
  container_port: 80
credentials:
  admin_username: admin
  admin_password: benchmark-only
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/kityminder:1.4.50
    tag: 1.4.50
    digest: sha256:f9bff912eb65e7c30b3ef4b5aabb65afb69f2ee47fd6b5eda001c929a9a22b6c
    platform: linux/amd64
