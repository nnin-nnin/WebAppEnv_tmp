application:
  name: yudao
  version: default
  type: complete_web_application
  deployment_mode: native_compose
  description: "Native Docker Compose deployment for Yudao (芋道源码 / ruoyi-vue-pro) with MySQL 8, Redis, Nginx and Spring Boot application."

target:
  platform: linux/amd64
  compose_project: yudao-default
  compose_file: docker/compose.yaml
  host_port: 18877
  host_port_variable: HOST_PORT
  browser_url: http://127.0.0.1:18877/
  login_url: http://127.0.0.1:18877/

source:
  repository: https://github.com/YunaiV/yudao-cloud
  fixed_ref: HEAD
  immutable_commit: 23c8c608af9da8f08bca5c62d096d4253bcce93f
  metadata: source/source.yaml
  availability: github_only
  frontend_note: "Yudao Vue3 Element Plus admin UI."

compose:
  project_name: yudao-default
  services:
    - application
  volumes:
    - application-db
    - application-redis
    - application-data
  pull_policy: missing

image_delivery:
  method: DOCKERHUB
  metadata: image/image.json
  application_image: yorem/yudao:default@sha256:3d3461894dfa5c38509a15aa4faec8b1804f04e365b1276fb52f6ea083e924e0

delivery_method: DOCKERHUB
dockerhub_namespace: yorem
source_metadata: source/source.yaml

services:
  - name: application
    role: "Yudao server application runtime with integrated MySQL, Redis, Spring Boot and Nginx"
    image: yorem/yudao:default@sha256:3d3461894dfa5c38509a15aa4faec8b1804f04e365b1276fb52f6ea083e924e0
    digest: sha256:3d3461894dfa5c38509a15aa4faec8b1804f04e365b1276fb52f6ea083e924e0
    platform: linux/amd64
    source: "https://github.com/YunaiV/yudao-cloud commit 23c8c608af9da8f08bca5c62d096d4253bcce93f"
    ports:
      - "${HOST_PORT:-18877}:80"
    healthcheck: "HTTP GET http://127.0.0.1/healthz inside container"

initialization:
  database: "Pre-seeded MySQL database with complete schema and seed accounts."
  idempotence: "Checks for existing database files before initialization."
  manual_sql_import_required: false
  runtime_dependency_downloads: false

accounts:
  initial_admin:
    username: admin
    password: admin123
    email: admin@example.com
    role: administrator
    creation_method: "Pre-seeded into MySQL system_users table"
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  login_script: resources/login.sh

operations:
  start: bash scripts/up.sh
  healthcheck: bash scripts/healthcheck.sh
  reset: bash scripts/reset.sh

acceptance:
  expected_checks:
    - compose_config
    - dockerhub_image_pull
    - clean_database_initialization
    - application_health
    - initial_admin_login
  final_state: "After scripts/up.sh, application container reports healthy status."

known_limits:
  - "Yudao default environment is optimized for security benchmark evaluation."
