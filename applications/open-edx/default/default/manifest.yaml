application: open-edx
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/openedx/edx-platform
  commit: ca039029e4918f02903b1c7d62adf8b3ad74f75b

runtime:
  language: python:3.11
  framework: openedx-lms
  database: mariadb:10.5

ports:
  host_port: 18848
  container_port: 8000

credentials:
  admin_username: admin@example.com
  admin_password: AdminPassword123!

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  database_seed: resources/init.sql

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/open-edx:default@sha256:45e3208cd0fcd17d94660136f8ec83bfa5bcd7d426c9f42d6308d896c223c6a6
    tag: default
    digest: sha256:45e3208cd0fcd17d94660136f8ec83bfa5bcd7d426c9f42d6308d896c223c6a6
    platform: linux/amd64
  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: '10.5'
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
