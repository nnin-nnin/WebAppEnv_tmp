{% extends "base.html" %}
{% block content %}
<div style="max-width: 650px; margin: 0 auto;">
    <h1 style="font-size: 26px; font-weight: 800; color: #00262b; margin-bottom: 20px;">Account Settings</h1>
    <div class="card">
        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #00262b;">User Profile</h2>
        <div style="font-size: 14px; line-height: 2;">
            <p><strong>Username:</strong> {{ session['user']['username'] }}</p>
            <p><strong>Email Address:</strong> {{ session['user']['email'] }}</p>
            <p><strong>System Role:</strong> {{ session['user']['role'] }}</p>
            <p><strong>Platform Status:</strong> Active &bull; Verified</p>
        </div>
        <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
            <a href="/dashboard" class="btn btn-outline">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
