name: forum
services:
  db:
    image: mariadb:10.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: df
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
    volumes:
      - db_data:/var/lib/mysql
      - ../resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "root"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: yorem/forum:default
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18091:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/toIndex.do | grep -E '200|302'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
