application: kibana
version: 6.5.4
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml

source:
  repository: https://github.com/elastic/kibana
  commit: 2d4c9c3fd9afd81ded3ac2e686bc1f7204078f14

runtime:
  language: nodejs
  node: "8.14.0"

ports:
  host_port: 18649
  container_port: 5601

credentials:
  admin_username: admin
  admin_password: benchmark-only

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/kibana:6.5.4@sha256:0209a5433ed49346858507bdccca1c5afc99a540f34f0d8a86eca8197ddd8aca
    tag: 6.5.4
    digest: sha256:0209a5433ed49346858507bdccca1c5afc99a540f34f0d8a86eca8197ddd8aca
    platform: linux/amd64
  db:
    image: elasticsearch:6.5.4@sha256:7053b3979a1dd709f2a225d52bc53622714790b13d88cf08164d252291ab8b61
    tag: 6.5.4
