name: jeesite-default-default

services:
  jeesite:
    image: yorem/jeesite:default@sha256:fe3bc6aac459af55ead57e757b731f01f6e4cc054632c3252138533d90652419
    platform: linux/amd64
    ports:
      - "18834:8080"
    environment:
      JAVA_OPTS: "-Dserver.port=8080 -Dspring.profiles.active=prod -Dfile.encoding=UTF-8"
    volumes:
      - ../resources/data/jeesite-db:/data/jeesite-db
      - application-data:/data/userfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080/vue/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  application-data:
