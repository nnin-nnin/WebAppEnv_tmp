roles:
  - name: corpAdmin
    permissions: "系统管理员，客户方最高管理角色，拥有系统所有基础数据与配置权限"
    purpose: "系统管理"
    relation: "admin 账号对应管理员角色"
  - name: dept
    permissions: "部门经理角色，具备部门层级管理与业务审批权限"
    purpose: "部门管理"
    relation: "部门主管用户角色"
  - name: user
    permissions: "普通员工角色，具备基础业务录入与查看权限"
    purpose: "常规业务操作"
    relation: "常规员工对应角色"
  - name: default
    permissions: "默认角色，系统新注册或普通用户默认继承的基准权限"
    purpose: "基础授权"
    relation: "系统共有角色"
