application:
  name: JeeSite
  version: default
  type: full_web_application
  description: "JeeSite is an enterprise-grade rapid application development platform based on Spring Boot and MyBatis."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境为原生单容器 All-in-One Docker Compose 编排，内置 H2 嵌入式关系型数据库与免向导初始化数据，开箱即用。"
  compose_file: docker/compose.yaml
  project_name: jeesite-default-default
  host_port: 18834
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/thinkgem/jeesite
    commit: e6cfff73551a50f749cbf107c59e6c3cf2586e52
    source_yaml: source/source.yaml

services:
  jeesite:
    service_name: jeesite
    role: "JeeSite Application Service (Spring Boot / OpenJDK 17 with embedded H2 Database)"
    image: yorem/jeesite:default@sha256:fe3bc6aac459af55ead57e757b731f01f6e4cc054632c3252138533d90652419
    digest: "sha256:fe3bc6aac459af55ead57e757b731f01f6e4cc054632c3252138533d90652419"
    platform: linux/amd64
    ports:
      - "18834:8080"
    dependencies: []
    healthcheck: "curl -f -s -o /dev/null http://localhost:8080/vue/login || exit 1"

credentials:
  admin_username: admin
  admin_password: admin
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
