name: code-server-4-90-3

services:
  app:
    image: yorem/code-server:4.90.3@sha256:81706b71ace316157850cbcfb574714d1067249c107a415b3a03dc6b613ebfbc
    platform: linux/amd64
    ports:
      - "18698:8080"
    environment:
      - PASSWORD=Admin123456!
    volumes:
      - code_server_data:/home/coder
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  code_server_data:
