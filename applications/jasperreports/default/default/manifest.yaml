application:
  name: jasperreports
  version: default
  type: full_web_application
  description: "JasperReports Server is a high-performance, stand-alone and embeddable reporting and analytics server."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境为原生多容器 Docker Compose 编排。JasperReports 报表系统与 MariaDB 10.5 数据库分别运行在独立容器中，并通过 Compose 内部网络安全互联。"
  compose_file: docker/compose.yaml
  project_name: jasperreports-default-default
  host_port: 18832
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/TIBCOSoftware/jasperreports
    commit: 154a63ac28d12f4442a08118ffb70f4030cdbb0c
    source_yaml: source/source.yaml

services:
  jasperreports:
    service_name: jasperreports
    role: "JasperReports Application Service (Tomcat 9 / Java 11)"
    image: yorem/jasperreports:default@sha256:77050833114497735c3f94079c98eaa63f7d4399b76843f5247e9682648da657
    digest: "sha256:77050833114497735c3f94079c98eaa63f7d4399b76843f5247e9682648da657"
    platform: linux/amd64
    ports:
      - "18832:8080"
    dependencies:
      - mariadb
    healthcheck: "curl -f -s -o /dev/null http://localhost:8080/jasperserver/login.html || exit 1"
    volumes:
      - jasperreports-data
  mariadb:
    service_name: mariadb
    role: "Relational Database (MariaDB 10.5)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -u root -pbitnami || exit 1"
    volumes:
      - mariadb-data

credentials:
  admin_username: jasperadmin
  admin_password: jasperadmin
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
