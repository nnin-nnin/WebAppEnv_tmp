name: jasperreports-default-default

services:
  jasperreports:
    image: yorem/jasperreports:default@sha256:77050833114497735c3f94079c98eaa63f7d4399b76843f5247e9682648da657
    platform: linux/amd64
    ports:
      - "18832:8080"
    environment:
      - BITNAMI_DEBUG=true
      - MARIADB_HOST=mariadb
      - MARIADB_PORT_NUMBER=3306
      - JASPERREPORTS_DATABASE_TYPE=mariadb
      - JASPERREPORTS_DATABASE_HOST=mariadb
      - JASPERREPORTS_DATABASE_PORT_NUMBER=3306
      - JASPERREPORTS_DATABASE_NAME=bitnami_jasperreports
      - JASPERREPORTS_DATABASE_USER=bn_jasperreports
      - JASPERREPORTS_DATABASE_PASSWORD=bitnami
      - JASPERREPORTS_USERNAME=jasperadmin
      - JASPERREPORTS_PASSWORD=jasperadmin
      - ALLOW_EMPTY_PASSWORD=no
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - jasperreports-data:/bitnami/jasperreports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080/jasperserver/login.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mariadb:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
    environment:
      - MYSQL_ROOT_PASSWORD=bitnami
      - MYSQL_DATABASE=bitnami_jasperreports
      - MYSQL_USER=bn_jasperreports
      - MYSQL_PASSWORD=bitnami
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -pbitnami || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  jasperreports-data:
  mariadb-data:
