application_name: invoiceninja
application_version: 5.13.30
application_type: complete_web
deployment_mode: native_compose
compose_file: docker/compose.yaml
compose_project: invoiceninja-5-13-30
official_compose_source: https://github.com/invoiceninja/dockerfiles/blob/5.13.30/docker compose.yml
backend_repository: https://github.com/yorem/invoiceninja:5.13.30
backend_commit: 79cce332a786810d6ace6a6eaa3e06fd818a9407
frontend_repository: https://github.com/yorem/invoiceninja:5.13.30
delivery_method: DOCKERHUB
dockerhub_namespace: invoiceninja
services:
  server:
    service_name: server
    role: web_server
    image: nginx
    tag: 1.25-alpine
    digest: sha256:721fa00bc549df26b3e67cc558ff176112d4ba69847537766f3c28e171d180e7
    platform: linux/amd64
    source: library/nginx
    ports:
      - "18085:80"
    dependencies:
      - app
    volumes:
      - app-public:/var/www/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  app:
    service_name: app
    role: application
    image: yorem/invoiceninja:5.13.30@sha256:31962034a40e1d6bb505082365525747df73c22307327c129dd0662966598cb7
    tag: 5.13.30
    digest: sha256:31962034a40e1d6bb505082365525747df73c22307327c129dd0662966598cb7
    platform: linux/amd64
    source: yorem/invoiceninja:5.13.30
    dependencies:
      - db
    volumes:
      - app-public:/var/www/app/public:rw
      - app-storage:/var/www/app/storage:rw
  db:
    service_name: db
    role: database
    image: mysql
    tag: 8.0
    digest: sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
    platform: linux/amd64
    source: library/mysql
    volumes:
      - database-data:/var/lib/mysql
    healthcheck: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
resources:
  - resources/users.yaml
  - resources/roles.yaml
  - resources/login.sh
  - resources/register.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
recommended_start_command: "docker compose -p invoiceninja-5-13-30 -f docker/compose.yaml up -d"
compose_differences:
  - Changed image tags to fixed versions and digests.
  - Replaced host bind mounts with named volumes for data persistence and public files sharing.
  - Added explicit healthchecks for db.
  - Used explicit `depends_on` conditions.
  - Dropped unnecessary extra_hosts and cron container (v5 supervisord handles cron).
known_risks: []
