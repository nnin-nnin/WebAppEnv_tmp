services:
  server:
    image: nginx:1.25-alpine@sha256:721fa00bc549df26b3e67cc558ff176112d4ba69847537766f3c28e171d180e7
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/app/public:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:18085:80"

  app:
    image: yorem/invoiceninja:5.13.30@sha256:31962034a40e1d6bb505082365525747df73c22307327c129dd0662966598cb7
    platform: linux/amd64
    restart: unless-stopped
    environment:
      APP_URL: "http://127.0.0.1:18085"
      APP_KEY: "base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      APP_DEBUG: "true"
      REQUIRE_HTTPS: "false"
      PHANTOMJS_PDF_GENERATION: "false"
      PDF_GENERATOR: "snappdf"
      TRUSTED_PROXIES: "*"
      QUEUE_CONNECTION: "database"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "ninja"
      DB_USERNAME: "ninja"
      DB_PASSWORD: "ninja"
      IN_USER_EMAIL: "admin@example.com"
      IN_PASSWORD: "adminpassword"
    volumes:
      - app-public:/var/www/app/public:rw
      - app-storage:/var/www/app/storage:rw
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "ninjaAdm1nPassword"
      MYSQL_USER: "ninja"
      MYSQL_PASSWORD: "ninja"
      MYSQL_DATABASE: "ninja"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pninjaAdm1nPassword"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  app-public:
  app-storage:
  database-data:
