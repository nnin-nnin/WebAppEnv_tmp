application: flaskbb
version: 2.1.0
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/flaskbb/flaskbb
  commit: 0fc9c03e537d32f7c481f79971ea1bae86b5fe34
runtime:
  python: '2.7'
  web_server: gunicorn
  database: sqlite3
ports:
  host_port: 18642
  container_port: 5000
credentials:
  admin_username: admin
  admin_password: benchmark-only
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/flaskbb:2.1.0
    tag: 2.1.0
    digest: sha256:74a8f4a09a23139f995f12c4341cb2dc3652e1a257d54100a6269b082001e0d2
    platform: linux/amd64
