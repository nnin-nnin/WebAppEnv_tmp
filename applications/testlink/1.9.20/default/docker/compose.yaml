name: testlink-1920

services:
  application:
    image: yorem/testlink:1.9.20@sha256:8ae9312c1e647b77be6e27cf9938d3cfc780e979ce8812c6d5774cfc8a934ea2
    platform: linux/amd64
    ports:
      - "18601:80"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ../resources/config_db.inc.php:/var/www/html/testlink/config_db.inc.php:ro
      - ../resources/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/login.php || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mariadb:
    image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    platform: linux/amd64
    command: --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: testlink_root_password
      MYSQL_DATABASE: testlink
      MYSQL_USER: testlink
      MYSQL_PASSWORD: testlink
    volumes:
      - ../resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mariadb-data:
