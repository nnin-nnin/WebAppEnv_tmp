application: MintHCM
version: 4.0.4
application_type: complete-web-application
source_repository: https://github.com/minthcm/minthcm.git
source_commit: e821f829d64ad1eaea8b98f04ad2891dfbe282e8
source_commit_tag: 4.0.4
frontend_repository: null
frontend_commit: null
target_platform: linux/amd64
runtime:
  php: 8.0
  node_build: 16
  web_server: Apache 2.4 with mod_rewrite
  database: MariaDB server (Debian Bullseye package, 127.0.0.1)
  search: Elasticsearch 7.9.3
frontend:
  build_command: npm ci --no-audit --no-fund && npm run build
  static_directory: vue/dist
  browser_entry: http://localhost:18520/
  api_base: same-origin relative /api/* within the all-in-one container
port: 18520
image: yorem/minthcm:4.0.4@sha256:15d6134f5a18e201890a8bd31426ea6edc17fbb030c245de0863fb06f78bbb6b
all_in_one: true
all_in_one_description: 单镜像、单容器、内部包含应用服务和数据库服务的 all-in-one 环境；镜像内包含真实 Vue 前端静态资源。
components:
  - MintHCM 4.0.4 backend and fixed source
  - MintHCM Vue frontend static bundle
  - PHP 8.0 runtime and Apache
  - MariaDB database service
  - Elasticsearch 7.9.3 service
  - automatic idempotent database and application initialization
image_metadata: image/image.json
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
  register: resources/register.sh
scripts:
  build: scripts/build.sh
  start: scripts/up.sh
  entrypoint: scripts/entrypoint.sh
  healthcheck: scripts/healthcheck.sh
  container_healthcheck: scripts/healthcheck-container.sh
  reset: scripts/reset.sh
recommended_run: docker compose -f docker/compose.yaml up -d
source_metadata_file: source/source.yaml
source_availability: upstream_repository_only
