application: fluentd-ui
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/fluent/fluentd-ui
  commit: e75cc0d60d071b1b77b84ad81be0cfe41b447676
runtime:
  language: ruby
  ruby: "2.2.3"
ports:
  host_port: 18826
  container_port: 9292
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/fluentd-ui:default@sha256:2ae6a94acb86fa642162421bd7cf28a8e96a42f7cad3830f025c2544130fd959
    tag: default
    digest: sha256:2ae6a94acb86fa642162421bd7cf28a8e96a42f7cad3830f025c2544130fd959
    platform: linux/amd64
