application: hostel
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/Bharat-Reddy/Hostel-Management-System
  commit: 179ff3e1c01a51a2e6e90ba88f6ca7ca9d63fd2b
  ref: master
runtime:
  language: php
  server: apache
  database: mariadb:10.5
ports:
  host_port: 18830
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  app:
    image: yorem/hostel:default@sha256:25e75b94f02b81704907aa98eda2f71942b622e7cd3eae239fafb76816ba6a6b
    tag: default
    digest: sha256:25e75b94f02b81704907aa98eda2f71942b622e7cd3eae239fafb76816ba6a6b
    platform: linux/amd64
  db:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    tag: "10.5"
    digest: sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    platform: linux/amd64
