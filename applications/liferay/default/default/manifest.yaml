application:
  name: Liferay
  version: default
  type: full_web_application
  description: "Liferay Portal is an enterprise-grade open-source portal and digital platform built on Java."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境为原生 Docker Compose 编排。Liferay Portal 门户服务运行于独立容器中，使用内置 HSQLDB 数据库与免配置向导模式实现冷启动即用。"
  compose_file: docker/compose.yaml
  project_name: liferay-default-default
  host_port: 18838
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/liferay/liferay-portal
    commit: 604772365b53450367eb9d769bb58ea354bc59c2
    tag: 7.4.3.4-ga4
    source_yaml: source/source.yaml

services:
  liferay:
    service_name: liferay
    role: "Liferay Portal Application Service (Tomcat / Java 8)"
    image: yorem/liferay:default@sha256:dc8211e1454e1fffc063eebc57aec590ba1e75f33d4af36cbccb3c8797d8edba
    digest: "sha256:dc8211e1454e1fffc063eebc57aec590ba1e75f33d4af36cbccb3c8797d8edba"
    platform: linux/amd64
    ports:
      - "18838:8080"
    dependencies: []
    healthcheck: "curl -f -s -o /dev/null http://localhost:8080 || exit 1"
    volumes:
      - liferay-data

credentials:
  admin_username: test@liferay.com
  admin_password: test
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
