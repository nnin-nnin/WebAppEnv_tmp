name: liferay-default-default

services:
  liferay:
    image: yorem/liferay:default@sha256:dc8211e1454e1fffc063eebc57aec590ba1e75f33d4af36cbccb3c8797d8edba
    platform: linux/amd64
    ports:
      - "18838:8080"
    environment:
      LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"
      LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ADD_PERIOD_SAMPLE_PERIOD_DATA: "false"
      LIFERAY_TERMS_PERIOD_OF_PERIOD_USE_PERIOD_REQUIRED: "false"
      LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
      LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED: "false"
    volumes:
      - ../resources/portal-ext.properties:/opt/liferay/portal-ext.properties:ro
      - liferay-data:/opt/liferay/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  liferay-data:
