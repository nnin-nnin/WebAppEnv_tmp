# Liferay Portal Custom Properties for Automated Benchmark Environment
# Disable Setup Wizard
setup.wizard.enabled=false

# Default Admin User
company.default.web.id=liferay.com
admin.email.from.address=test@liferay.com
admin.email.from.name=Test Test
default.admin.first.name=Test
default.admin.last.name=Test
default.admin.screen.name=test
default.admin.email.address.prefix=test
default.admin.password=test

# Skip Terms of Use and Password Reset prompts
terms.of.use.required=false
users.reminder.queries.enabled=false
users.reminder.queries.custom.question.enabled=false
passwords.default.policy.change.required=false
passwords.default.policy.changeable=true
passwords.default.policy.check.syntax=false

# Authentication configuration
company.security.auth.type=emailAddress
