name: discourse-default

services:
  discourse:
    image: yorem/discourse:default@sha256:29779eb92e8d2db42a6b06bbec3e6b94b273738dccf6f17c9b75ce0a58292e68
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18816}:80"
    environment:
      - DISCOURSE_HOSTNAME=127.0.0.1
      - DISCOURSE_DB_HOST=db
      - DISCOURSE_DB_PORT=5432
      - DISCOURSE_DB_NAME=discourse
      - DISCOURSE_DB_USERNAME=discourse
      - DISCOURSE_DB_PASSWORD=discourse
      - DISCOURSE_REDIS_HOST=redis
      - DISCOURSE_REDIS_PORT=6379
      - DISCOURSE_DEVELOPER_EMAILS=admin@example.com
      - PRECOMPILE_ON_BOOT=0
      - MIGRATE_ON_BOOT=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - discourse-data:/shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/session/csrf || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s

  db:
    image: pgvector/pgvector:pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    platform: linux/amd64
    environment:
      - POSTGRES_USER=discourse
      - POSTGRES_PASSWORD=discourse
      - POSTGRES_DB=discourse
    volumes:
      - ../resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discourse -d discourse || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  discourse-data:
  db-data:
