application: discourse
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/discourse/discourse
  commit: b9f5e76cc179d1e1ac8ad5e05dbe4ec01184d925
runtime:
  language: Ruby 3.4 / Rails 8.1
  web_server: Nginx with Pitchfork
  database: PostgreSQL 15 (pgvector)
  cache: Redis 7
ports:
  host_port: 18816
  container_port: 80
credentials:
  admin_username: admin
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  discourse:
    image: yorem/discourse:default@sha256:29779eb92e8d2db42a6b06bbec3e6b94b273738dccf6f17c9b75ce0a58292e68
    tag: default
    digest: sha256:29779eb92e8d2db42a6b06bbec3e6b94b273738dccf6f17c9b75ce0a58292e68
    platform: linux/amd64
  db:
    image: pgvector/pgvector:pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    tag: pg15
    digest: sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    platform: linux/amd64
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    tag: 7-alpine
    digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
