name: alfresco-263019

services:
  alfresco:
    image: yorem/alfresco:26.3.0.19@sha256:bddb4e96b0452208ae836993b12b35afad596e9fabf71ccb814d4f86383c18db
    mem_limit: 2560m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.createIndexIfNotExists=true
        -Delasticsearch.host=elasticsearch
        -Delasticsearch.port=9200
        -Dshare.host=localhost
        -Dshare.port=18006
        -Dalfresco.host=localhost
        -Dalfresco.port=18006
        -Dcsrf.filter.enabled=false
        -Daos.baseUrlOverwrite=http://localhost:18006/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 15s
      timeout: 5s
      retries: 25
      start_period: 60s
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      activemq:
        condition: service_healthy

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.3
    mem_limit: 384m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx192m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    depends_on:
      activemq:
        condition: service_healthy

  share:
    image: docker.io/alfresco/alfresco-share:26.2.0
    mem_limit: 512m
    environment:
      CSRF_FILTER_ORIGIN: http://localhost:18006
      CSRF_FILTER_REFERER: http://localhost:18006/share/.*
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -Xms128m
        -Xmx256m
        -Dalfresco.host=localhost
        -Dalfresco.port=18006
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8080/share/page/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      alfresco:
        condition: service_healthy

  postgres:
    image: postgres:17.4-alpine
    mem_limit: 256m
    environment:
      - POSTGRES_PASSWORD=alfresco
      - POSTGRES_USER=alfresco
      - POSTGRES_DB=alfresco
    command: postgres -c max_connections=200 -c shared_buffers=32MB -c log_min_messages=LOG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: elasticsearch:8.17.10
    mem_limit: 1024m
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch-data:/usr/share/elasticsearch/data

  batch-indexing:
    image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing:5.7.0
    mem_limit: 256m
    depends_on:
      elasticsearch:
        condition: service_healthy
      alfresco:
        condition: service_healthy
      transform-core-aio:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms96m -Xmx160m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: alfresco
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: secret
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: 15s
      ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL: 1s
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: 30m
      ALFRESCO_REINDEX_CONTINUOUS_OVERLAP: 10m

  activemq:
    image: docker.io/alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
    mem_limit: 384m
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
      - ACTIVEMQ_OPTS=-Xms128m -Xmx192m
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:admin", "http://localhost:8161/admin/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  content-app:
    image: alfresco/alfresco-content-app:8.0.0
    mem_limit: 64m
    environment:
      APP_BASE_SHARE_URL: "http://localhost:18006/aca/#/preview/s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

  control-center:
    image: quay.io/alfresco/alfresco-control-center:11.0.0
    mem_limit: 64m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      BASE_PATH: ./
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    mem_limit: 64m
    ports:
      - "18006:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      alfresco:
        condition: service_healthy
      share:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  alfresco-data:
  postgres-data:
  elasticsearch-data:
