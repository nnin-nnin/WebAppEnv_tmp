application_name: Alfresco
version: 26.3.0.19
application_type: full_web_application
deployment_mode: native_compose
compose_file: docker/compose.yaml
project_name: alfresco-26.3.0.19

official_compose_source:
  repository: https://github.com/Alfresco/acs-deployment
  path: docker-compose/community-compose.yaml

source_repository:
  url: https://github.com/Alfresco/alfresco-community-repo
  commit: a826bc61c22066267f951e9682e4d21aa6f491e8
  tag: 26.3.0.19

delivery_method: DOCKERHUB
docker_hub_namespace: yorem

main_application_image:
  image: yorem/alfresco
  tag: 26.3.0.19
  digest: sha256:bddb4e96b0452208ae836993b12b35afad596e9fabf71ccb814d4f86383c18db
  platform: linux/amd64
  pushed: true

services:
  - service_name: alfresco
    role: Content Repository Application Server
    image: yorem/alfresco:26.3.0.19
    digest: sha256:bddb4e96b0452208ae836993b12b35afad596e9fabf71ccb814d4f86383c18db
    platform: linux/amd64
    depends_on:
      - postgres
      - elasticsearch
      - activemq

  - service_name: share
    role: Web Management Client Interface
    image: docker.io/alfresco/alfresco-share:26.2.0
    digest: sha256:887ff27d2c3df4fc57064372957b447a1d1d86d634cb38d948ea4d8c83e298e3
    platform: linux/amd64
    depends_on:
      - alfresco

  - service_name: postgres
    role: Relational Database
    image: postgres:17.4-alpine
    digest: sha256:7f47493a52c0fb359a68a5c3ed6cf6d45e54d588506144e05b1c5a14d5e75141
    platform: linux/amd64

  - service_name: elasticsearch
    role: Search Subsystem Index Server
    image: elasticsearch:8.17.10
    digest: sha256:1f7a0c64e6b528b7e28b8cf4f36dbb84c8a202a0a2df367f08c3ef051ef4045c
    platform: linux/amd64

  - service_name: activemq
    role: Message Broker
    image: docker.io/alfresco/alfresco-activemq:6.2.6-jre17-rockylinux8
