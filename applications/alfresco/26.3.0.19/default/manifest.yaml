    platform: linux/amd64

  - service_name: transform-core-aio
    role: All-In-One Content Transformation Engine
    image: alfresco/alfresco-transform-core-aio:5.4.3
    digest: sha256:f1262d141e6c3826048dc268c7ffbfcebeea0b91d2ebfa32bfef185966607e0b
    platform: linux/amd64

  - service_name: batch-indexing
    role: Elasticsearch Batch Indexing Engine
    image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing:5.7.0
    digest: sha256:73981882d2c161962325997b6a10052309ceaeeddd352c39dcaedb44e73b22fb
    platform: linux/amd64

  - service_name: content-app
    role: Alfresco Content App Web UI
    image: alfresco/alfresco-content-app:8.0.0
    digest: sha256:bb15bf2ee9bdfb13f890cf2c62c3e410f92b7bd5aeecb5d84c6bc9c5fefddc2a
    platform: linux/amd64

  - service_name: control-center
    role: Alfresco Control Center Admin UI
    image: quay.io/alfresco/alfresco-control-center:11.0.0
    digest: sha256:c02d1847e0aef2caeaec9482436d4dfecfaec075ebf1f31f96aa50085bd2a632
    platform: linux/amd64

  - service_name: proxy
    role: Reverse Proxy Gateway (Nginx)
    image: nginx:1.27-alpine
    digest: sha256:4ffdb2b3394602f232491a6136d2e67dfed36bf5563914a8497fa2ec6f2382f6
    platform: linux/amd64
    ports:
      - "18006:8080"

resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login_script: resources/login.sh
  register_script: resources/register.sh

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh

recommended_start_command: |
  docker compose -f docker/compose.yaml pull
  docker compose -f docker/compose.yaml up -d

differences_from_official: |
  1. 使用固定版本的镜像标签并推送到 Docker Hub `yorem/alfresco:26.3.0.19`。
  2. 使用 Nginx 替代原本依赖 `/var/run/docker.sock` 的 Traefik 代理，消除 Docker Socket 挂载安全隐患，完全符合规范第 318 条要求。
  3. 将对外访问端口固定映射为指定端口 18006。
  4. 整合官方 commons/base.yaml 并统一在单一 docker/compose.yaml 文件中管理所有服务。

known_limitations: |
  1. 必须在系统给定的 7.7GB 内存范围内运行，各容器调整了内存 limit 与 JVM 堆内存比例。
  2. 首次启动初始化数据库与索引约需 60-120 秒。
