name: spip-420

services:
  application:
    image: yorem/spip:4.2.0@sha256:7516d1e529971a6653e746f9004c719735daa973d389c36e46c75dfbe93b74bf
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18611}:80"
    environment:
      SPIP_DB_SERVER: mysql
      SPIP_DB_HOST: db
      SPIP_DB_LOGIN: spip
      SPIP_DB_PASS: spip
      SPIP_DB_NAME: spip
      SPIP_ADMIN_LOGIN: admin
      SPIP_ADMIN_PASS: benchmark-only
      SPIP_ADMIN_EMAIL: admin@example.com
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application-data:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  db:
    image: mariadb:10.11@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: spip-root-password
      MYSQL_DATABASE: spip
      MYSQL_USER: spip
      MYSQL_PASSWORD: spip
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  application-data:
  db-data:
