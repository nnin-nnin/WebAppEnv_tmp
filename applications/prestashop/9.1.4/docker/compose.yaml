name: prestashop-9-1-4

services:
  application:
    image: yorem/prestashop:9.1.4@sha256:483befaaf88fe85854a8f5f8b98912045ff895f7cd4c7e1187b54f6b8f68b973
    extra_hosts:
      - "i18n.prestashop-project.org:104.18.16.231"
      - "api.prestashop.com:104.18.12.107"
      - "prestashop.com:104.18.12.107"
      - "addons.prestashop.com:104.18.12.107"
    ports:
      - "18401:80"
    volumes:
      - ./opcache.ini:/usr/local/etc/php/conf.d/zz-disable-opcache.ini:ro
      - prestashop-db:/var/lib/mysql
      - prestashop-config:/var/www/html/app/config
      - prestashop-runtime:/var/www/html/var
      - prestashop-images:/var/www/html/img
      - prestashop-upload:/var/www/html/upload
      - prestashop-download:/var/www/html/download

volumes:
  prestashop-db:
  prestashop-config:
  prestashop-runtime:
  prestashop-images:
  prestashop-upload:
  prestashop-download:
