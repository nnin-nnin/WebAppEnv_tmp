name: publiccms_default_default

services:
  application:
    image: yorem/publiccms:default@sha256:8586ce021af4b2dff5ff223da913c36a59e6fab91c6243ce22164a814da74507
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18860:8080"
    volumes:
      - ../resources/install.lock:/data/publiccms/install.lock:ro
      - ../resources/database.properties:/data/publiccms/database.properties:ro
    restart: unless-stopped

  db:
    image: mysql:8.0.36@sha256:a532724022429812ec797c285c1b540a644c15e248579c6bfdf12a8fbaab4964
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: publiccms
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - database-data:/var/lib/mysql
      - ../resources/initial-data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database-data:
