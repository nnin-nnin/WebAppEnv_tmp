name: erpnext-default

services:
  app:
    image: yorem/erpnext:default@sha256:1dea78cf18f4632ce6b9c251d2ef328de7142f02312a969c67316cc9bdb8ef1e
    platform: linux/amd64
    ports:
      - "${HOST_PORT:-18822}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=erpnext
      - DB_USER=erpnext
      - DB_PASSWORD=AdminPassword123!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRAPPE_SITE_NAME=frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:80/api/method/frappe.auth.get_logged_user || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 15s

  db:
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    platform: linux/amd64
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      - MYSQL_ROOT_PASSWORD=AdminPassword123!
      - MARIADB_ROOT_PASSWORD=AdminPassword123!
      - MYSQL_DATABASE=erpnext
      - MYSQL_USER=erpnext
      - MYSQL_PASSWORD=AdminPassword123!
    volumes:
      - ../resources/database-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAdminPassword123!"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
