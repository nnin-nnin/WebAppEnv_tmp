application: erpnext
version: default
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/frappe/erpnext
  commit: 46a04f01a619d6fed99e6d0f3e7a327d12d43388
runtime:
  language: Python 3.11 / Frappe Framework
  web_server: Nginx with Gunicorn
  database: MariaDB 10.6
  cache: Redis 7
ports:
  host_port: 18822
  container_port: 80
credentials:
  admin_username: Administrator
  admin_password: AdminPassword123!
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS
services:
  app:
    image: yorem/erpnext:default@sha256:1dea78cf18f4632ce6b9c251d2ef328de7142f02312a969c67316cc9bdb8ef1e
