name: jsherp-dual

services:
  app:
    image: yorem/jsherp:default
    platform: linux/amd64
    ports:
      - "18084:80"
    depends_on:
      jsh-mysql:
        condition: service_healthy
      jsh-redis:
        condition: service_healthy
    volumes:
      - ../resources/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || curl -f http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 35
      start_period: 25s
    restart: unless-stopped

  jsh-mysql:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    networks:
      default:
        aliases:
          - jsh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "jsh_erp"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ../resources/db:/docker-entrypoint-initdb.d:ro
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  jsh-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    platform: linux/amd64
    networks:
      default:
        aliases:
          - jsh-redis
    command: ["redis-server", "--requirepass", "1234abcd"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234abcd", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  database-data:
