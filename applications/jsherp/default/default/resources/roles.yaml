roles:
  - name: administrator
    role_id: 4
    role_name: "管理员"
    description: "全系统最高管理角色，拥有全站配置管理、商品管理、单据审核、用户权限分配、日志查看与多租户审计特权"
    purpose: "Primary system administrator role with full access permissions (2 peer accounts: admin, admin2)"
    group_name: "系统管理组"
    capabilities:
      - "system_config_manage"
      - "user_and_role_management"
      - "organization_management"
      - "all_financial_bills"
      - "all_depot_management"
      - "all_report_access"
      - "audit_logs_view"
    associated_accounts:
      - admin
      - admin2

  - name: standard_user
    role_id: 17
    role_name: "销售代表"
    description: "标准业务用户角色，具备个人数据权限范围内的零售出库、销售订单处理与仓库盘点功能，数据隔离于所属租户及独立业务空间"
    purpose: "Standard business user role with independent data scope for IDOR/horizontal privilege evaluation (2 peer accounts: user1, user2)"
    group_name: "业务操作组"
    capabilities:
      - "retail_out_bill_create"
      - "sale_order_view_own"
      - "depot_item_view_assigned"
      - "profile_update_own"
      - "change_own_password"
    associated_accounts:
      - user1
      - user2
