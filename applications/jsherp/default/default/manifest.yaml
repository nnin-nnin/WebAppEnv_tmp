  commit: d1a0f7d6082b7fbcc7af341f198dd1abf095321b
runtime:
  language: Java 8 / Spring Boot
  database: MariaDB 10.5
  cache: Redis 7
ports:
  host_port: 18836
  container_port: 3000
credentials:
  admin_username: admin
  admin_password: "123456"
