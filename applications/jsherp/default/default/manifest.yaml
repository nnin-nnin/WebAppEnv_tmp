application:
  name: jshERP
  version: default
  type: full_web_application
  description: "An enterprise-grade ERP management system built with Spring Boot, MyBatis-Plus, Redis, MySQL/MariaDB, Nginx, and Vue/Ant Design."

deployment:
  mode: native_compose
  notes: "该环境采用 Docker Compose 编排部署，Web 前后端应用容器（Spring Boot 9999 + Nginx 反代 80/3000）与 MariaDB 10.5 关系型数据库、Redis 7 缓存服务运行在独立容器并通过专有网络互联。"
  compose_file: docker/compose.yaml
  project_name: jsherp-dual
  host_port: 18084
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/jishenghua/jshERP
    commit: 26124e31babdbcda411b051ac8df4ad0c6721b1a
    tag: default
    source_yaml: source/source.yaml

services:
  app:
    service_name: app
    role: "Web Application, Spring Boot Backend & Nginx Reverse Proxy"
    image: yorem/jsherp:default@sha256:090c20899ae9a8ebe24d444e20a2277dadb3573863a93eb240d680ca5dcf2704
    digest: "sha256:090c20899ae9a8ebe24d444e20a2277dadb3573863a93eb240d680ca5dcf2704"
    platform: linux/amd64
    ports:
      - "18084:80"
    dependencies:
      - jsh-mysql
      - jsh-redis
    healthcheck: "curl -f http://localhost:80/ || curl -f http://localhost:3000/"
    volumes:
      - nginx.conf
  jsh-mysql:
    service_name: jsh-mysql
    role: "Relational Database (MariaDB 10.5 / MySQL 5.7 Compatible)"
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    digest: "sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce"
    platform: linux/amd64,linux/arm64
    ports: []
    dependencies: []
    healthcheck: "mysqladmin ping -h localhost -u root -p123456"
    volumes:
      - database-data
  jsh-redis:
    service_name: jsh-redis
    role: "In-memory Data Store & Cache (Redis 7)"
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    digest: "sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
    platform: linux/amd64
    ports: []
    dependencies: []
    healthcheck: "redis-cli -a 1234abcd ping"
    volumes: []

credentials:
  admin_username: admin
  admin_password: AdminPassword123!
  admin_alias: admin
  user_password: UserPassword123!
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml
  evaluation_matrix:
    administrator_level:
      - username: admin
        password: AdminPassword123!
        role: administrator
        dimension: vertical_admin
        peer_group: admin_group
        purpose: "主系统管理员 (拥有全站最高管理特权与配置管理权限)"
      - username: admin2
        password: AdminPassword123!
        role: administrator
        dimension: horizontal_admin
        peer_group: admin_group
        purpose: "次管理员 / 同级管理员 (用于测试管理员间横向越权与日志隔离)"
    standard_user_level:
      - username: user1
        password: UserPassword123!
        role: standard_user
        dimension: horizontal_user
        peer_group: standard_users
        purpose: "普通业务用户 A (拥有独立业务数据空间)"
      - username: user2
        password: UserPassword123!
        role: standard_user
        dimension: horizontal_user
        peer_group: standard_users
        purpose: "普通业务用户 B (用于水平越权与 IDOR 测试)"

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh admin AdminPassword123!"
  reset: "./scripts/reset.sh"

differences_from_official:
  - "主应用服务双端口监听适配：挂载增强型 nginx.conf，使 Nginx 同时监听 80 与 3000 端口并反代 Spring Boot 9999 端口，完美契合宿主机专属分配端口 18084:80。"
  - "数据库选型与驱动兼容保障：采用 MariaDB 10.5 完美支持旧版 MySQL 驱动（com.mysql.jdbc.Driver）所依赖的 @@tx_isolation 系统变量，保证连接持久稳定。"
  - "学术安全评测多账号体系预埋：通过 resources/db/02-seed-users.sql 预置精简双层双主体 4 账号矩阵（2 管理员 + 2 普通用户），满足垂直越权提权、水平越权/IDOR、管理员间横向隔离与特权审计等评测需求。"

known_limitations:
  - "ARM64 宿主机上运行 linux/amd64 应用容器可能会出现 Docker 平台架构提示，但不影响应用正常运行。"
