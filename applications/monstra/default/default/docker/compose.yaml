name: monstra-default

services:
  web:
    image: yorem/monstra:default@sha256:fa8bfc3f03ea14370ca1568c9f60a951637eb46eb2d731f5b77ccf7c9bb09482
    platform: linux/amd64
    ports:
      - "18845:80"
    environment:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "AdminPassword123!"
      SITE_URL: "http://localhost:18845"
      TZ: "UTC"
    restart: unless-stopped
    volumes:
      - monstra-storage:/var/www/html/storage
      - monstra-public:/var/www/html/public
      - monstra-backups:/var/www/html/backups

volumes:
  monstra-storage:
  monstra-public:
  monstra-backups:
