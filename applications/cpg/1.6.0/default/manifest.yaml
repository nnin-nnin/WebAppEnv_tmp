application: cpg
version: "1.6.0"
topology: compose
deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem
compose_file: docker/compose.yaml
source:
  repository: https://github.com/Tolfix/cpg-api.git
  commit: 116aeb2aefcc5dad9ffc207633d6f26b47aab64a
runtime:
  language: nodejs
  node_version: "16.14.2"
ports:
  host_port: 18758
  container_port: 8080
credentials:
  admin_username: admin
  admin_password: admin
resources:
  users: resources/users.yaml
  roles: resources/roles.yaml
  login: resources/login.sh
scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
source_metadata: source/source.yaml
source_checksums: source/SHA256SUMS

services:
  application:
    image: yorem/cpg:1.6.0@sha256:b97b24d0fb9516946bfe1698522ce54cc4b0ec893be9712698779958c363067d
    tag: "1.6.0"
