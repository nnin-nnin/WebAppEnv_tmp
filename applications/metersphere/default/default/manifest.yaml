application:
  name: metersphere
  version: default
  type: full_web_application
  description: "MeterSphere is an enterprise-grade open-source continuous testing platform that covers test management, API testing, and UI testing."

deployment_mode: native_compose
delivery_method: DOCKERHUB
dockerhub_namespace: yorem

deployment:
  mode: native_compose
  notes: "该环境为一体化容器 Docker Compose 编排。MeterSphere 主应用、内置 MariaDB、Kafka、Redis 与 MinIO 服务协同运行在单容器内，对外暴露 Web 服务端口。"
  compose_file: docker/compose.yaml
  project_name: metersphere-default-default
  host_port: 18842
  container_port: 8081
  delivery_method: DOCKERHUB
  dockerhub_namespace: yorem

source:
  backend:
    repository: https://github.com/metersphere/metersphere
    commit: 53df526e2fb08bdf933662acf7eb5ae0f1bd5e3a
    tag: default
    source_yaml: source/source.yaml

services:
  metersphere:
    service_name: metersphere
    role: "MeterSphere All-in-One Service (Spring Boot / MariaDB / Kafka / Redis / MinIO)"
    image: yorem/metersphere:default@sha256:2a15f4360901ec0fd007663396f0749481b27d665e3e23bd313fdbc7d4dbe1a3
    tag: default
    digest: "sha256:2a15f4360901ec0fd007663396f0749481b27d665e3e23bd313fdbc7d4dbe1a3"
    platform: linux/amd64
    ports:
      - "18842:8081"
    dependencies: []
    healthcheck: "curl -f -s -o /dev/null http://localhost:8081 || exit 1"
    volumes:
      - metersphere-data
      - metersphere-logs

credentials:
  admin_username: admin
  admin_password: metersphere
  users_file: resources/users.yaml
  roles_file: resources/roles.yaml

scripts:
  up: scripts/up.sh
  healthcheck: scripts/healthcheck.sh
  reset: scripts/reset.sh
  login: resources/login.sh

recommended_commands:
  pull: "docker compose -f docker/compose.yaml pull"
  up: "docker compose -f docker/compose.yaml up -d"
  healthcheck: "./scripts/healthcheck.sh"
  login: "./resources/login.sh"
  reset: "./scripts/reset.sh"
