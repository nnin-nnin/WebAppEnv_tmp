name: metersphere-default-default

services:
  metersphere:
    image: yorem/metersphere:default@sha256:2a15f4360901ec0fd007663396f0749481b27d665e3e23bd313fdbc7d4dbe1a3
    container_name: metersphere-default-default
    platform: linux/amd64
    ports:
      - "18842:8081"
    volumes:
      - metersphere-data:/opt/metersphere/data
      - metersphere-logs:/opt/metersphere/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://127.0.0.1:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

volumes:
  metersphere-data:
  metersphere-logs:
