name: Build RuoYi Vue Pro Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the verified image to Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ruoyi-vue-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify RuoYi Vue Pro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLICATION_DIR: applications/ruoyi-vue-pro/2026.06-jdk8
      IMAGE_VERSION: 2026.06-jdk8
      LOCAL_IMAGE: ruoyi-vue-pro:ci
      REMOTE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sop-ruoyi-vue-pro

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APPLICATION_DIR }}
          file: ${{ env.APPLICATION_DIR }}/docker/standalone.Dockerfile
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test container
        run: |
          docker run -d --name ruoyi-vue-pro-ci -p 18087:80 "$LOCAL_IMAGE"

      - name: Wait for application startup
        run: |
          for attempt in {1..72}; do
            if curl --fail --silent --show-error http://127.0.0.1:18087/healthz | grep --quiet '^ok$'; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ruoyi-vue-pro-ci)" != "true" ]; then
              docker logs ruoyi-vue-pro-ci
              exit 1
            fi
            sleep 5
          done
          docker logs ruoyi-vue-pro-ci
          exit 1

      - name: Run application health check
        run: bash "$APPLICATION_DIR/scripts/healthcheck.sh"

      - name: Show container logs on failure
        if: failure()
        run: docker logs ruoyi-vue-pro-ci

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image
        if: inputs.publish
        run: |
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE:$IMAGE_VERSION"
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE:$IMAGE_VERSION-${{ github.sha }}"
          docker push "$REMOTE_IMAGE:$IMAGE_VERSION"
          docker push "$REMOTE_IMAGE:$IMAGE_VERSION-${{ github.sha }}"

      - name: Remove test container
        if: always()
        run: docker rm -f ruoyi-vue-pro-ci
